<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">Kovelyx – Icône officielle</title>
<desc id="desc">Monogramme K formé de rubans violets et d'un symbole de lecture sur fond sombre.</desc>
