name: Tester Kovelyx TV sur émulateur Android TV

on:
  workflow_run:
    workflows:
      - "Compiler Kovelyx (APK et diagnostic Windows)"
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Identifiant du build TV réussi à tester'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: kovelyx-tv-smoke-${{ github.event.workflow_run.id || inputs.build_run_id || github.run_id }}
  cancel-in-progress: false

jobs:
  startup:
    name: Installer et démarrer Kovelyx TV avec la télécommande
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Vérifier la compilation et récupérer le bon APK TV
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ID: ${{ github.event.workflow_run.id || inputs.build_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_ID" =~ ^[0-9]+$ ]] || { echo "::error::Identifiant de build invalide"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_ID" > /tmp/kovelyx-run.json
          jq -e --arg repo "$GITHUB_REPOSITORY" '
            .head_repository.full_name == $repo and
            .head_branch == "main" and
            .status == "completed" and
            .name == "Compiler Kovelyx (APK et diagnostic Windows)"
          ' /tmp/kovelyx-run.json > /dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_ID/jobs?per_page=100" > /tmp/kovelyx-jobs.json
          jq -e '[.jobs[] | select(.name == "Android TV - APK Full Debug" and .conclusion == "success")] | length == 1' /tmp/kovelyx-jobs.json >/dev/null || {
            echo "::error::Aucun APK TV validé dans cette compilation"; exit 1;
          }
          mkdir -p /tmp/kovelyx-tv-apk
          gh run download "$BUILD_ID" --repo "$GITHUB_REPOSITORY" --name kovelyx-tv-debug --dir /tmp/kovelyx-tv-apk
          mapfile -d '' apks < <(find /tmp/kovelyx-tv-apk -type f -iname '*universal*.apk' -print0)
          [[ "${#apks[@]}" == 1 ]] || { echo "::error::APK TV universel attendu : ${#apks[@]} trouvés"; exit 1; }
          unzip -tq "${apks[0]}" > /dev/null
          SOURCE_SHA="$(jq -r '.head_sha' /tmp/kovelyx-run.json)"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          jq -n --argjson build_run_id "$BUILD_ID" --arg source_sha "$SOURCE_SHA" '{build_run_id:$build_run_id,source_sha:$source_sha}' > /tmp/kovelyx-tv-build-proof.json
          echo "APK TV valide : ${apks[0]}"
      - name: Accès KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Essai sur Google TV 34 (Leanback)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          # Le SDK Android 34 n'expose pas android-tv/x86_64 sur les runners.
          # Google TV API 34 propose une image x86 compatible Leanback.
          target: google-tv
          arch: x86
          profile: tv_1080p
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disk-size: 6144M
          disable-animations: true
          script: |
            adb install -r "$(find /tmp/kovelyx-tv-apk -type f -iname '*universal*.apk' -print -quit)"
            adb shell monkey -p com.kovelyx.tv.debug -c android.intent.category.LEANBACK_LAUNCHER 1
            sleep 25
            adb shell pidof com.kovelyx.tv.debug
            adb shell input keyevent KEYCODE_DPAD_RIGHT
            adb shell input keyevent KEYCODE_DPAD_CENTER
            adb shell screencap -p /sdcard/kovelyx-tv-smoke.png
            adb pull /sdcard/kovelyx-tv-smoke.png /tmp/kovelyx-tv-smoke.png
      - name: Enregistrer la preuve de compilation testée
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kovelyx-tv-build-proof
          path: /tmp/kovelyx-tv-build-proof.json
          if-no-files-found: error
          retention-days: 90
      - name: Sauvegarder la capture TV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kovelyx-tv-emulator-screenshot
          path: /tmp/kovelyx-tv-smoke.png
          if-no-files-found: ignore
          retention-days: 30
