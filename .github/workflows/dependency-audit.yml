name: Auditer les dépendances et les liens Nuvio

on:
  push:
    branches: [main]
    paths:
      - 'shared/**'
      - '.github/workflows/dependency-audit.yml'
      - 'scripts/audit-dependencies.py'
      - 'scripts/audit-nuvio.py'
      - 'apps/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kovelyx-dependency-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inventorier les références aux services externes
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit-dependencies.py
          python scripts/audit-nuvio.py
          test -s docs/AUDIT_DEPENDANCES.md
          test -s docs/AUDIT_NUVIO.md
          echo "### Références aux services Nuvio encore présentes" >> "$GITHUB_STEP_SUMMARY"
          grep -E 'Fichiers texte examinés' docs/AUDIT_DEPENDANCES.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Conserver les rapports sans nouveau commit sur main
        uses: actions/upload-artifact@v4
        with:
          name: kovelyx-audit-dependances-${{ github.sha }}
          path: |
            docs/AUDIT_DEPENDANCES.md
            docs/AUDIT_NUVIO.md
          retention-days: 30
          if-no-files-found: error
