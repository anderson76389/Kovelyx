name: Auditer les dépendances et les liens Nuvio

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dependency-audit.yml'
      - 'scripts/audit-dependencies.py'
      - 'scripts/audit-nuvio.py'
      - 'apps/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kovelyx-dependency-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inventorier les références aux services externes
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit-dependencies.py
          python scripts/audit-nuvio.py
          test -s docs/AUDIT_DEPENDANCES.md
          test -s docs/AUDIT_NUVIO.md
          echo "### Références aux services Nuvio encore présentes" >> "$GITHUB_STEP_SUMMARY"
          grep -E 'Fichiers texte examinés' docs/AUDIT_DEPENDANCES.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Conserver le rapport dans les sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/AUDIT_DEPENDANCES.md docs/AUDIT_NUVIO.md
          if git diff --cached --quiet; then
            echo "Rapport inchangé"
          else
            git commit -m "docs: met à jour l'inventaire des dépendances"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
