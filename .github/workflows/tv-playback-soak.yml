name: Mesurer trente minutes de lecture Media3 sur Google TV
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/tests/fixtures/tv/Media3PlaybackSoakTest.kt'
      - 'scripts/tests/tv-playback-soak.sh'
      - '.github/workflows/tv-playback-soak.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kovelyx-tv-playback-soak-${{ github.ref }}
  cancel-in-progress: true
jobs:
  soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Vérifier le parseur de frames et le script de lecture
        run: |
          python3 -m unittest discover -s scripts/tests -p test_tv_frame_phases.py
          bash -n scripts/tests/tv-playback-soak.sh
      - name: Préparer le runner et la vidéo locale 720p30
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libpulse0 libnss3 libxkbcommon0
          sudo chmod 666 /dev/kvm
          assets=apps/tv/app/src/androidTest/assets
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'testsrc2=size=1280x720:rate=30' -f lavfi -i 'sine=frequency=440:sample_rate=48000' -t 30 -c:v libx264 -preset ultrafast -crf 28 -pix_fmt yuv420p -c:a aac -b:a 96k -movflags +faststart "$assets/playback-soak.mp4"
          (cd "$assets" && sha256sum playback-soak.mp4 > playback-soak.sha256)
          ffmpeg -version | head -n 1
          cat "$assets/playback-soak.sha256"
      - name: Compiler le moteur TV et le test de lecture prolongée
        run: |
          cp scripts/tests/fixtures/tv/Media3PlaybackSoakTest.kt apps/tv/app/src/androidTest/java/com/kovelyx/tv/ui/screens/player/Media3PlaybackSoakTest.kt
          chmod +x apps/tv/gradlew
          ./apps/tv/gradlew -p apps/tv :app:assembleFullDebug :app:assembleFullDebugAndroidTest --no-daemon --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=768m"
      - name: Lecture réelle de trente minutes avec mesures CPU et PSS
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google-tv
          arch: x86
          profile: tv_1080p
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disk-size: 6144M
          disable-animations: true
          script: bash scripts/tests/tv-playback-soak.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tv-playback-30-minutes
          path: /tmp/kovelyx-playback-soak/
          if-no-files-found: warn
          retention-days: 60
