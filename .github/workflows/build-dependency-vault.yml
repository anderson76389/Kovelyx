name: Vérifier le coffre local des dépendances
on:
  pull_request:
    paths:
      - 'scripts/build-dependency-vault.py'
      - 'scripts/tests/test_build_dependency_vault.py'
      - '.github/workflows/build-dependency-vault.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/build-dependency-vault.py'
      - 'scripts/tests/test_build_dependency_vault.py'
      - '.github/workflows/build-dependency-vault.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vault:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts/tests -p test_build_dependency_vault.py
