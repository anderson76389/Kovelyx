name: Vérifier Kovelyx Cloudflare (Workers et D1)
on:
  push:
    branches: [main]
    paths:
      - 'services/kovelyx-cloudflare/**'
      - 'scripts/configure-cloud-build.py'
      - '.github/workflows/cloudflare-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier la syntaxe Python et le schéma SQLite D1
        run: |
          python -m py_compile scripts/configure-cloud-build.py
          python -m py_compile services/kovelyx-cloudflare/scripts/first-account.py
          python services/kovelyx-cloudflare/tests/check-d1-schema.py
      - name: Vérifier le script installation Cloudflare
        working-directory: services/kovelyx-cloudflare
        run: node --check scripts/setup.mjs
      - name: Installer les dépendances Worker
        working-directory: services/kovelyx-cloudflare
        run: npm install --no-audit --no-fund
      - name: Contrôler les appels sécurisés et le contrat
        working-directory: services/kovelyx-cloudflare
        run: npm test
      - name: Compiler le Worker (sans déploiement ni identifiants Cloudflare)
        working-directory: services/kovelyx-cloudflare
        run: npx wrangler deploy --dry-run --outdir /tmp/kovelyx-cloudflare-dist
