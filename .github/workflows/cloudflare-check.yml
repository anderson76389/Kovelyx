name: Vérifier Kovelyx Cloudflare (Workers et D1)
on:
  push:
    branches: [main, fix/cloudflare-network-status-and-settings]
    paths:
      - 'services/kovelyx-cloudflare/**'
      - 'apps/**/core/cloud/**'
      - 'apps/tv/app/src/main/java/com/nuvio/tv/core/sync/**'
      - 'apps/tv/app/src/main/java/com/nuvio/tv/data/repository/WatchProgressRepositoryImpl.kt'
      - 'scripts/configure-cloud-build.py'
      - '.github/workflows/cloudflare-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/kovelyx-cloudflare/**'
      - 'apps/**/core/cloud/**'
      - 'apps/tv/app/src/main/java/com/nuvio/tv/core/sync/**'
      - 'apps/tv/app/src/main/java/com/nuvio/tv/data/repository/WatchProgressRepositoryImpl.kt'
      - 'scripts/configure-cloud-build.py'
      - '.github/workflows/cloudflare-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier les anciens domaines dans les sources et bibliothèques
        run: |
          python3 scripts/tests/verify-upstream-independence.py
          python3 scripts/tests/audit-tv-nuvio-urls.py
          python3 scripts/tests/audit-packaged-binaries.py
      - name: Signaler uniquement la disponibilité de l’accès de déploiement
        if: github.event_name == 'push'
        env:
          CF_TOKEN_PRESENT: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_PRESENT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_PRESENT: ${{ vars.KOVELYX_D1_DATABASE_ID }}
        run: |
          python3 - <<'PYDEPLOY'
          import os
          required = {'CLOUDFLARE_API_TOKEN':'CF_TOKEN_PRESENT', 'CLOUDFLARE_ACCOUNT_ID':'CF_ACCOUNT_PRESENT', 'KOVELYX_D1_DATABASE_ID':'CF_D1_PRESENT'}
          missing = [name for name, env in required.items() if not os.environ.get(env)]
          print('Accès de déploiement : ' + ('configuré' if not missing else 'non configuré ; champs manquants : ' + ', '.join(missing)))
          print('Ce contrôle ne déploie rien et ne lit aucun compte utilisateur.')
          PYDEPLOY
      - name: Observer le schéma réellement déployé (lecture seule)
        if: github.event_name == 'push'
        env:
          KOVELYX_CLOUDFLARE_URL: ${{ vars.KOVELYX_CLOUDFLARE_URL || 'https://kovelyx-cloud.mailpromahe.workers.dev' }}
        run: |
          python3 - <<'PYLIVE'
          import json, os, urllib.request
          base = os.environ['KOVELYX_CLOUDFLARE_URL'].rstrip('/')
          try:
              request = urllib.request.Request(base + '/ready', headers={'Accept':'application/json', 'User-Agent':'Kovelyx-readonly-diagnostic'})
              with urllib.request.urlopen(request, timeout=15) as response:
                  body = json.load(response)
                  schema = str(body.get('schema', 'absent'))[:80]
                  print('Serveur réel : HTTP', response.status, '; schéma :', schema)
                  if body.get('status') == 'ok' and schema == '0003_profile_media':
                      print('Routes images du nouveau schéma disponibles ; échange authentifié sur appareils à vérifier séparément.')
                  else:
                      print('Images privées : mise à jour du Worker et migration 0003 encore nécessaires.')
          except Exception as error:
              print('Diagnostic distant indisponible :', type(error).__name__)
              print('Aucune validation du serveur réel ne peut être déduite des tests locaux.')
          PYLIVE
      - name: Vérifier la syntaxe Python et le schéma SQLite D1
        run: |
          python -m py_compile scripts/configure-cloud-build.py
          python -m py_compile services/kovelyx-cloudflare/scripts/first-account.py
          python services/kovelyx-cloudflare/tests/test_first_account_request.py
          python services/kovelyx-cloudflare/tests/check-d1-schema.py
      - name: Vérifier le script installation Cloudflare
        working-directory: services/kovelyx-cloudflare
        run: node --check scripts/setup.mjs
      - name: Installer les dépendances Worker
        working-directory: services/kovelyx-cloudflare
        run: npm install --no-audit --no-fund
      - name: Contrôler les appels sécurisés et le contrat
        working-directory: services/kovelyx-cloudflare
        run: npm test
      - name: Vérifier de vrais comptes et profils sur Worker + D1 locaux
        working-directory: services/kovelyx-cloudflare
        timeout-minutes: 4
        env:
          WRANGLER_SEND_METRICS: "false"
        run: node tests/local-account-e2e.mjs
      - name: Compiler le Worker (sans déploiement ni identifiants Cloudflare)
        working-directory: services/kovelyx-cloudflare
        run: npx wrangler deploy --dry-run --outdir /tmp/kovelyx-cloudflare-dist
