name: Reprendre une publication de préversion vérifiée

on:
  push:
    branches: [fix/cloudflare-network-status-and-settings]
    paths:
      - 'scripts/publish-verified-preview.py'
      - 'scripts/tests/test_verified_preview.py'
      - '.github/workflows/recover-verified-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kovelyx-recover-preview
  cancel-in-progress: false

jobs:
  recover:
    if: github.repository == 'anderson76389/Kovelyx' && github.ref == 'refs/heads/fix/cloudflare-network-status-and-settings'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tester la reprise et les contrôles de provenance
        run: python3 scripts/tests/test_verified_preview.py
      - name: Reprendre uniquement les paquets identiques déjà vérifiés
        env:
          GH_TOKEN: ${{ secrets.KOVELYX_RELEASE_TOKEN || github.token }}
          KOVELYX_RECOVER_PREVIEW: '1'
        run: python3 scripts/publish-verified-preview.py
