name: Tester le site Kovelyx

on:
  push:
    branches: [main]
    paths: &site_paths
      - 'README.md'
      - 'assets/brand/kovelyx-platforms.svg'
      - 'assets/brand/kovelyx-banner.svg'
      - 'docs/index.html'
      - 'docs/site.css'
      - 'docs/site.js'
      - 'docs/brand/**'
      - '.github/workflows/site-check.yml'
      - 'scripts/test-site-downloads.cjs'
  pull_request:
    paths: *site_paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    name: Liens, ressources et JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la syntaxe JavaScript
        run: node --check docs/site.js
      - name: Tester les téléchargements Windows, Android et TV simulés
        run: node scripts/test-site-downloads.cjs
      - name: Valider les illustrations SVG des quatre plateformes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          files = ['assets/brand/kovelyx-banner.svg', 'assets/brand/kovelyx-platforms.svg', 'docs/brand/banner.svg']
          for name in files:
              root = ET.parse(name).getroot()
              assert root.tag.endswith('svg'), name
              assert root.attrib.get('viewBox'), 'SVG sans viewBox : ' + name
              assert all(value in Path(name).read_text(encoding='utf-8') for value in ('Windows', 'Linux', 'Android')), name
          readme = Path('README.md').read_text(encoding='utf-8')
          assert 'plateforme=linux#plateformes' in readme
          assert 'kovelyx-platforms.svg' in readme
          page = Path('docs/index.html').read_text(encoding='utf-8')
          assert 'id="kv-linux"' in page and 'data-platform="linux"' in page
          print('OK : trois SVG et quatre plateformes dans le README et le site')
          PY
      - name: Vérifier la page HTML et les liens internes
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = set()
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  props = dict(attrs)
                  if 'id' in props:
                      assert props['id'] not in self.ids, 'Identifiant dupliqué : ' + props['id']
                      self.ids.add(props['id'])
                  for attribute in ('src','href'):
                      value = props.get(attribute, '')
                      if value:
                          self.links.append(value)
          root = Path('docs')
          page = Page()
          page.feed((root / 'index.html').read_text(encoding='utf-8'))
          for link in page.links:
              if link.startswith('#'):
                  assert link[1:] in page.ids, 'Ancre cassée : ' + link
              elif link.startswith('./'):
                  assert link == './' or (root / link[2:]).is_file(), 'Fichier local absent : ' + link
          js = (root / 'site.js').read_text(encoding='utf-8')
          assert 'api.github.com/repos/' in js, 'Intégration GitHub Releases absente'
          assert 'browser_download_url' in js, 'Lien de téléchargement vérifié manquant'
          assert not (root / 'site.css').stat().st_size == 0, 'Feuille de style vide'
          print('OK : ressources locales, ancres, identifiants et source des Releases')
          PY
