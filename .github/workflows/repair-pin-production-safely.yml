name: Réparer la migration PIN Cloudflare après sauvegarde D1 chiffrée
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-pin-production-safely.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kovelyx-cloudflare-production
  cancel-in-progress: false

jobs:
  backup-and-pin:
    name: Sauvegarder D1, vérifier la récupération puis corriger uniquement la migration PIN
    if: \${{ github.repository == 'anderson76389/Kovelyx' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KOVELYX_D1_DATABASE_ID: \${{ vars.KOVELYX_D1_DATABASE_ID || secrets.KOVELYX_D1_DATABASE_ID }}
      KOVELYX_CLOUDFLARE_URL: \${{ vars.KOVELYX_CLOUDFLARE_URL || 'https://kovelyx-cloud.mailpromahe.workers.dev' }}
      KOVELYX_ANDROID_SIGNING_BUNDLE: \${{ secrets.KOVELYX_ANDROID_SIGNING_BUNDLE }}
      BACKUP_OUTPUT_DIR: \${{ runner.temp }}/kovelyx-pin-recovery-encrypted
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier tous les tests Worker, la migration et la restauration D1 hors production
        working-directory: services/kovelyx-cloudflare
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm test
          python3 tests/check-d1-schema.py
          python3 tests/test_backup_validation.py
          npx --no-install wrangler deploy --dry-run --outdir /tmp/kovelyx-pin-repair-check
      - name: Vérifier que le Worker actuel a uniquement le schéma PIN manquant
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --connect-timeout 10 --max-time 25 -o /tmp/kv-ready-before-pin.json -w '%{http_code}' "\${KOVELYX_CLOUDFLARE_URL%/}/ready")"
          [[ "$code" == "200" ]] || { echo "::error::Le Worker ne répond pas HTTP 200 ; aucune écriture D1."; exit 1; }
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/kv-ready-before-pin.json',encoding='utf-8'))
          assert data.get('status')=='ok' and data.get('provider')=='Cloudflare D1'
          assert data.get('schema')=='0004_profile_media_gifs', 'Migration D1 0004 manquante'
          assert data.get('catalogueSnapshotSchema')==1, 'Protocole catalogues absent'
          pin=data.get('profilePinSchema')
          assert pin in (None,0,1), 'Réponse du serveur non reconnue'
          print('Pré-contrôle : catalogue et médias intacts ; schéma PIN attendu :',pin)
          PY
      - name: Exporter l'intégralité de D1 et vérifier la restauration en mémoire avant la migration
        shell: bash
        run: |
          set -euo pipefail
          python3 services/kovelyx-cloudflare/scripts/backup-remote.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          out=Path(os.environ['BACKUP_OUTPUT_DIR'])
          manifest=json.loads((out/'manifest.json').read_text(encoding='utf-8'))
          assert manifest['validation_status']=='passed', 'Restauration isolée non validée'
          assert manifest['format']=='CMS-AES-256-GCM-RSA4096', 'Sauvegarde non chiffrée'
          encrypted=out/'kovelyx-d1.sql.cms'
          assert encrypted.is_file() and encrypted.stat().st_size>1000, 'Copie chiffrée absente'
          assert hashlib.sha256(encrypted.read_bytes()).hexdigest()==manifest['encrypted_sha256']
          assert manifest['counts']['tables']['kv_profiles'] >= 0
          print('La copie SQL est entièrement chiffrée ; restauration SQLite, médias et catalogues vérifiés.')
          PY
      - name: Conserver la sauvegarde chiffrée AVANT toute écriture D1
        uses: actions/upload-artifact@v4
        with:
          name: kovelyx-before-pin-migration-\${{ github.run_id }}
          path: \${{ runner.temp }}/kovelyx-pin-recovery-encrypted/
          if-no-files-found: error
          retention-days: 90
      - name: Vérifier la migration PIN additive et la cible D1 existante
        working-directory: services/kovelyx-cloudflare
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          account=os.environ.get('CLOUDFLARE_ACCOUNT_ID','')
          database=os.environ.get('KOVELYX_D1_DATABASE_ID','')
          assert re.fullmatch(r'[0-9a-fA-F]{32}',account)
          assert re.fullmatch(r'[0-9a-fA-F]{8}(?:-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}',database)
          sql=Path('migrations/0005_profile_pins.sql').read_text(encoding='utf-8')
          assert 'CREATE TABLE IF NOT EXISTS kv_profile_pins' in sql
          assert not re.search(r'\b(DROP|TRUNCATE|DELETE|UPDATE|ALTER)\b',sql,re.I)
          conf=Path('wrangler.toml')
          source=conf.read_text(encoding='utf-8')
          assert source.count('REPLACE_WITH_YOUR_D1_DATABASE_ID')==1
          assert 'binding = "DB"' in source
          conf.write_text(source.replace('REPLACE_WITH_YOUR_D1_DATABASE_ID',database),encoding='utf-8')
          conf.chmod(0o600)
          print('Migration non destructive et identifiant D1 contrôlés.')
          PY
      - name: Appliquer la migration D1 0005 sans effacer les profils
        working-directory: services/kovelyx-cloudflare
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install wrangler d1 migrations apply DB --remote
      - name: Déployer le Worker Kovelyx en conservant les secrets et variables existants
        working-directory: services/kovelyx-cloudflare
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install wrangler deploy --keep-vars
      - name: Vérifier la production PIN, médias, catalogues et comptes après migration
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --retry 3 --retry-delay 3 --connect-timeout 10 --max-time 25 -o /tmp/kv-ready-after-pin.json -w '%{http_code}' "\${KOVELYX_CLOUDFLARE_URL%/}/ready")"
          [[ "$code" == 200 ]] || { echo "::error::Réparation non confirmée : Worker HTTP $code"; exit 1; }
          python3 - <<'PY'
          import json
          ready=json.load(open('/tmp/kv-ready-after-pin.json',encoding='utf-8'))
          assert ready.get('status')=='ok' and ready.get('provider')=='Cloudflare D1'
          assert ready.get('schema')=='0004_profile_media_gifs', 'Médias D1 non confirmés'
          assert ready.get('catalogueSnapshotSchema')==1, 'Catalogues D1 non confirmés'
          assert ready.get('profilePinSchema')==1, 'PIN D1 0005 pas encore présent'
          print('PASS : PIN D1 0005, médias 0004, catalogues 1, Worker Cloudflare prêts.')
          PY
          echo '✅ Migration PIN appliquée après sauvegarde chiffrée validée ; catalogues et médias confirmés. Tests physiques à réaliser sur Android TV.' >> "$GITHUB_STEP_SUMMARY"
