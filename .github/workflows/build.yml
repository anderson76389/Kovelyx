name: Compiler Kovelyx (APK et diagnostic Windows)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'apps/**'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Application à compiler'
        required: true
        default: all
        type: choice
        options:
          - all
          - tv
          - mobile
          - desktop

concurrency:
  group: kovelyx-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tv:
    name: Android TV - APK Full Debug
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'tv' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Sources Kovelyx
        uses: actions/checkout@v4
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Vérifier le SDK Android préinstallé
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          test -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compiler Android TV
        working-directory: apps/tv
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleFullDebug --no-daemon --max-workers=2 --stacktrace -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m" -Pkotlin.compiler.execution.strategy=in-process
      - name: Enregistrer les APK TV
        uses: actions/upload-artifact@v4
        with:
          name: kovelyx-tv-debug
          path: apps/tv/app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  mobile:
    name: Android mobile - APK Full Debug
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'mobile' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Sources Kovelyx
        uses: actions/checkout@v4
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Vérifier le SDK Android préinstallé
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          test -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compiler Android mobile
        working-directory: apps/mobile
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :androidApp:assembleFullDebug --no-daemon --max-workers=2 --stacktrace -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m" -Pkotlin.compiler.execution.strategy=in-process
      - name: Enregistrer les APK mobiles
        uses: actions/upload-artifact@v4
        with:
          name: kovelyx-mobile-debug
          path: apps/mobile/androidApp/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  desktop:
    name: Windows - Vérification des prérequis MSI
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'desktop' }}
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Sources Kovelyx
        uses: actions/checkout@v4
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Vérifier les bibliothèques natives indispensables
        id: native
        shell: pwsh
        run: |
          $dll = "apps/desktop/composeApp/src/desktopMain/native/windows/runtime/libmpv-2.dll"
          if (Test-Path $dll) {
            "available=true" >> $env:GITHUB_OUTPUT
            "### Windows : bibliothèque MPV trouvée, compilation autorisée" >> $env:GITHUB_STEP_SUMMARY
          } else {
            "available=false" >> $env:GITHUB_OUTPUT
            Write-Host "::notice title=Windows non compilé::La DLL MPV (115 Mo) manque ; aucun MSI n'est produit. Voir apps/desktop/.kovelyx-binaries-a-sauvegarder.txt"
            "### Windows : compilation non tentée" >> $env:GITHUB_STEP_SUMMARY
            "Le binaire libmpv-2.dll (115 Mo) est absent du dépôt. Aucun MSI n'est disponible." >> $env:GITHUB_STEP_SUMMARY
          }
      - name: Compiler l'installateur MSI
        if: steps.native.outputs.available == 'true'
        working-directory: apps/desktop
        shell: pwsh
        run: |
          .\gradlew.bat :composeApp:packageReleaseMsi --no-daemon --max-workers=2 --stacktrace -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=768m"
      - name: Enregistrer le MSI
        if: steps.native.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kovelyx-desktop-msi
          path: apps/desktop/composeApp/build/compose/binaries/main-release/msi/*.msi
          if-no-files-found: error
          retention-days: 7
