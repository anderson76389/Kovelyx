name: Compiler Kovelyx (diagnostic)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'apps/**'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Application à compiler'
        required: true
        default: all
        type: choice
        options:
          - all
          - tv
          - mobile
          - desktop

permissions:
  contents: read

jobs:
  tv:
    name: Android TV - APK Full Debug
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'tv' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Sources Kovelyx
        uses: actions/checkout@v4
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compiler Android TV
        working-directory: apps/tv
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleFullDebug --no-daemon --max-workers=2 --stacktrace -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m" -Pkotlin.compiler.execution.strategy=in-process
      - name: Enregistrer les APK TV
        uses: actions/upload-artifact@v4
        with:
          name: kovelyx-tv-debug
          path: apps/tv/app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  mobile:
    name: Android mobile - APK Full Debug
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'mobile' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Sources Kovelyx
        uses: actions/checkout@v4
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compiler Android mobile
        working-directory: apps/mobile
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :androidApp:assembleFullDebug --no-daemon --max-workers=2 --stacktrace -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m" -Pkotlin.compiler.execution.strategy=in-process
      - name: Enregistrer les APK mobiles
        uses: actions/upload-artifact@v4
        with:
          name: kovelyx-mobile-debug
          path: apps/mobile/androidApp/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  desktop:
    name: Windows - MSI Debug de référence
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'desktop' }}
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Sources Kovelyx
        uses: actions/checkout@v4
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Vérifier les bibliothèques natives indispensables
        shell: pwsh
        run: |
          $dll = "apps/desktop/composeApp/src/desktopMain/native/windows/runtime/libmpv-2.dll"
          if (-not (Test-Path $dll)) {
            Write-Error "libmpv-2.dll (115 Mo) est absent du dépôt Git : voir apps/desktop/.kovelyx-binaries-a-sauvegarder.txt. Pas de MSI déclaré fonctionnel avant restauration et contrôle des licences."
            exit 1
          }
      - name: Compiler l'installateur MSI
        working-directory: apps/desktop
        shell: pwsh
        run: |
          .\gradlew.bat :composeApp:packageReleaseMsi --no-daemon --max-workers=2 --stacktrace -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=768m"
      - name: Enregistrer le MSI
        uses: actions/upload-artifact@v4
        with:
          name: kovelyx-desktop-msi
          path: apps/desktop/composeApp/build/compose/binaries/main-release/msi/*.msi
          if-no-files-found: error
          retention-days: 7
