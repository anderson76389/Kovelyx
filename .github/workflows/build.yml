name: Compiler Kovelyx (APK et diagnostic Windows)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'apps/tv/**'
      - 'apps/mobile/**'
      - 'apps/desktop/**'
      - 'vendor/engine/**'
      - 'scripts/media3/**'
      - 'scripts/desktop-release-version.py'
      - 'scripts/sign-ci-debug-apk.sh'
      - '.github/workflows/publish-signed-android.yml'
      - 'scripts/publish-unified-preview.sh'
      - '.github/workflows/publish-unified-preview.yml'
      - '.github/workflows/windows.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/tv/**'
      - 'apps/mobile/**'
      - 'apps/desktop/composeApp/Configuration/DesktopVersion.properties'
      - '.github/workflows/build.yml'
      - 'scripts/desktop-release-version.py'
      - 'scripts/sign-ci-debug-apk.sh'
      - '.github/workflows/publish-signed-android.yml'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Application à compiler'
        required: true
        default: all
        type: choice
        options:
          - all
          - tv
          - mobile
          - desktop

concurrency:
  group: kovelyx-build-${{ github.ref }}
  # Chaque commit validé peut recevoir sa propre préversion ; ne pas annuler l'ancien build.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  changes:
    name: Détecter les plateformes modifiées
    runs-on: ubuntu-latest
    outputs:
      tv: ${{ steps.paths.outputs.tv }}
      mobile: ${{ steps.paths.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: paths
        with:
          filters: |
            tv:
              - 'apps/tv/**'
              - 'apps/mobile/**'
              - 'apps/desktop/**'
              - 'vendor/engine/**'
              - 'scripts/media3/**'
              - 'scripts/desktop-release-version.py'
              - 'scripts/sign-ci-debug-apk.sh'
              - '.github/workflows/publish-signed-android.yml'
              - 'scripts/publish-unified-preview.sh'
              - '.github/workflows/publish-unified-preview.yml'
              - '.github/workflows/build.yml'
            mobile:
              - 'apps/tv/**'
              - 'apps/mobile/**'
              - 'apps/desktop/**'
              - 'vendor/engine/**'
              - 'scripts/media3/**'
              - 'scripts/desktop-release-version.py'
              - 'scripts/sign-ci-debug-apk.sh'
              - '.github/workflows/publish-signed-android.yml'
              - 'scripts/publish-unified-preview.sh'
              - '.github/workflows/publish-unified-preview.yml'
              - '.github/workflows/build.yml'

  tv:
    name: Android TV - APK Full Debug
    needs: changes
    if: ${{ ((github.event_name == 'push' || github.event_name == 'pull_request') && needs.changes.outputs.tv == 'true') || (github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'tv')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Sources Kovelyx
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aligner la version Android sur la Release Windows
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 scripts/desktop-release-version.py)"
          [[ "$version" =~ ^1[.]1[.][0-9]+-(alpha|beta|rc)$ ]] || { echo "::error::Version multi-plateforme invalide : $version"; exit 1; }
          count="$(git rev-list --count HEAD)"
          echo "KOVELYX_BUILD_VERSION=$version" >> "$GITHUB_ENV"
          echo "KOVELYX_BUILD_CODE=$((100000 + count))" >> "$GITHUB_ENV"
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Vérifier le SDK Android préinstallé
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          test -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Configurer le Worker Cloudflare Kovelyx dans Android TV (facultatif)
        shell: bash
        env:
          KOVELYX_CLOUDFLARE_URL: ${{ vars.KOVELYX_CLOUDFLARE_URL || 'https://kovelyx-cloud.mailpromahe.workers.dev' }}
        run: python3 scripts/configure-cloud-build.py --platform tv
      - name: Compiler Android TV
        working-directory: apps/tv
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleFullDebug --no-daemon --max-workers=1 --stacktrace -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=768m" -Pkotlin.compiler.execution.strategy=in-process -Pkovelyx.app.versionName="$KOVELYX_BUILD_VERSION" -Pkovelyx.app.versionCode="$KOVELYX_BUILD_CODE"
      - name: Tester les liens profonds Kovelyx TV
        working-directory: apps/tv
        shell: bash
        run: |
          ./gradlew :app:testFullDebugUnitTest --tests 'com.nuvio.tv.core.deeplink.DeepLinkParserTest' --no-daemon --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process
      - name: Vérifier l'APK universel et son identité TV
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' apks < <(find apps/tv/app/build/outputs/apk/full/debug -maxdepth 1 -name '*universal*.apk' -print0)
          [[ "${#apks[@]}" == 1 ]] || { echo "::error::Un seul APK universel TV attendu"; exit 1; }
          unzip -tq "${apks[0]}" > /dev/null
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$tools/apksigner" verify --verbose "${apks[0]}" >/dev/null
          "$tools/aapt" dump badging "${apks[0]}" | tee /tmp/kv-tv-badging.txt
          grep -F "package: name='com.kovelyx.tv.debug'" /tmp/kv-tv-badging.txt
          # The launcher label is intentionally clean even for debug builds.
          grep -Fx "application-label:'Kovelyx'" /tmp/kv-tv-badging.txt || {
            echo "::error::Android TV doit afficher uniquement Kovelyx, sans suffixe Test/Debug"
            exit 1
          }
          grep -E "leanback|android.software.leanback" /tmp/kv-tv-badging.txt
          grep -F "versionName='$KOVELYX_BUILD_VERSION'" /tmp/kv-tv-badging.txt
          grep -F "versionCode='$KOVELYX_BUILD_CODE'" /tmp/kv-tv-badging.txt
          echo "APK Kovelyx TV universel, signé et identifié correctement" >> "$GITHUB_STEP_SUMMARY"
      - name: Restaurer la signature permanente des APK publics
        if: ${{ github.event_name != 'pull_request' }}
        env:
          KOVELYX_ANDROID_SIGNING_BUNDLE: ${{ secrets.KOVELYX_ANDROID_SIGNING_BUNDLE }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/restore-android-signing.py
      - name: Signer l'APK TV avec le certificat Kovelyx stable
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        run: bash scripts/sign-ci-debug-apk.sh tv
      - name: Effacer la clé privée après signature
        if: ${{ always() }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/kovelyx-release.jks"
      - name: Enregistrer les APK TV
        uses: actions/upload-artifact@v4
        with:
          name: kovelyx-tv-debug
          path: apps/tv/app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  mobile:
    name: Android mobile - APK Full Debug
    needs: changes
    if: ${{ ((github.event_name == 'push' || github.event_name == 'pull_request') && needs.changes.outputs.mobile == 'true') || (github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'mobile')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Sources Kovelyx
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aligner la version Android sur la Release Windows
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 scripts/desktop-release-version.py)"
          [[ "$version" =~ ^1[.]1[.][0-9]+-(alpha|beta|rc)$ ]] || { echo "::error::Version multi-plateforme invalide : $version"; exit 1; }
          count="$(git rev-list --count HEAD)"
          echo "KOVELYX_BUILD_VERSION=$version" >> "$GITHUB_ENV"
          echo "KOVELYX_BUILD_CODE=$((100000 + count))" >> "$GITHUB_ENV"
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Vérifier le SDK Android préinstallé
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          test -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Configurer le Worker Cloudflare Kovelyx dans Android mobile (facultatif)
        shell: bash
        env:
          KOVELYX_CLOUDFLARE_URL: ${{ vars.KOVELYX_CLOUDFLARE_URL || 'https://kovelyx-cloud.mailpromahe.workers.dev' }}
        run: python3 scripts/configure-cloud-build.py --platform mobile
      - name: Compiler Android mobile
        working-directory: apps/mobile
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :androidApp:assembleFullDebug --no-daemon --max-workers=2 --stacktrace -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m" -Pkotlin.compiler.execution.strategy=in-process -Pkovelyx.app.versionName="$KOVELYX_BUILD_VERSION" -Pkovelyx.app.versionCode="$KOVELYX_BUILD_CODE"
      - name: Vérifier l'APK mobile et l'identité Kovelyx
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' apks < <(find apps/mobile/androidApp/build/outputs/apk/full/debug -maxdepth 1 -type f -name '*.apk' -print0)
          [[ "${#apks[@]}" == 1 ]] || { echo "::error::Un APK Android mobile unique attendu"; exit 1; }
          unzip -tq "${apks[0]}" > /dev/null
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$tools/apksigner" verify --verbose "${apks[0]}" >/dev/null
          "$tools/aapt" dump badging "${apks[0]}" > /tmp/kv-android-badging
          grep -F "package: name='com.kovelyx.mobile.debug'" /tmp/kv-android-badging
          grep -Fx "application-label:'Kovelyx'" /tmp/kv-android-badging || {
            echo "::error::Android mobile doit afficher uniquement Kovelyx, sans suffixe Test/Debug"
            exit 1
          }
          grep -F "versionName='$KOVELYX_BUILD_VERSION'" /tmp/kv-android-badging
          grep -F "versionCode='$KOVELYX_BUILD_CODE'" /tmp/kv-android-badging
          echo "APK mobile universel, signé et identifié comme Kovelyx" >> "$GITHUB_STEP_SUMMARY"
      - name: Restaurer la signature permanente des APK publics
        if: ${{ github.event_name != 'pull_request' }}
        env:
          KOVELYX_ANDROID_SIGNING_BUNDLE: ${{ secrets.KOVELYX_ANDROID_SIGNING_BUNDLE }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/restore-android-signing.py
      - name: Signer l'APK mobile avec le certificat Kovelyx stable
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        run: bash scripts/sign-ci-debug-apk.sh mobile
      - name: Effacer la clé privée après signature
        if: ${{ always() }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/kovelyx-release.jks"
      - name: Enregistrer les APK mobiles
        uses: actions/upload-artifact@v4
        with:
          name: kovelyx-mobile-debug
          path: apps/mobile/androidApp/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  desktop:
    name: Windows - Vérification des prérequis MSI
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'desktop') }}
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Sources Kovelyx
        uses: actions/checkout@v4
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Restaurer la DLL MPV archivée dans Kovelyx
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $runs = gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/native-windows.yml/runs?branch=main&status=success&per_page=10" | ConvertFrom-Json
          $success = @($runs.workflow_runs | Where-Object { $_.conclusion -eq 'success' } | Select-Object -First 1)
          if ($success.Count -ne 1) {
            Write-Host "::notice title=Windows::Aucune archive MPV vérifiée dans les artefacts Kovelyx."
            exit 0
          }
          $root = Join-Path $env:RUNNER_TEMP "kovelyx-mpv"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          gh run download $success[0].id --repo $env:GITHUB_REPOSITORY --name kovelyx-windows-mpv --dir $root
          if ($LASTEXITCODE -ne 0) { throw "Impossible de restaurer le runtime de Kovelyx." }
          $dll = Join-Path $root "libmpv-2.dll"
          if (-not (Test-Path $dll)) { throw "Runtime MPV absent de l'artefact." }
          $checksum = (Get-FileHash -Algorithm SHA256 $dll).Hash.ToLowerInvariant()
          if ($checksum -ne '07c68bb211f23a218ded0a36eb12207dc3aeb44e5318ffca6ce9dcc7c3173906') {
            throw "SHA256 MPV invalide."
          }
          if ((Get-Item $dll).Length -ne 115320296) { throw "Taille du binaire MPV incorrecte." }
          $dst = "apps/desktop/composeApp/src/desktopMain/native/windows/runtime"
          New-Item -ItemType Directory -Path $dst -Force | Out-Null
          Copy-Item -Path $dll -Destination (Join-Path $dst "libmpv-2.dll") -Force
          Write-Host "Runtime MPV restauré et contrôlé depuis les artefacts Kovelyx."
      - name: Préparer le SDK officiel Microsoft WebView2
        id: webview
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "1.0.2739.15"
          $dir = Join-Path $env:RUNNER_TEMP "kovelyx-webview2"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $package = Join-Path $dir "sdk.zip"
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/$version" -OutFile $package
          Expand-Archive -Path $package -DestinationPath (Join-Path $dir "sdk") -Force
          $sdk = Join-Path $dir "sdk"
          if (-not (Test-Path (Join-Path $sdk "build/native/include/WebView2.h"))) { throw "WebView2.h introuvable." }
          if (-not (Test-Path (Join-Path $sdk "build/native/x64/WebView2Loader.dll.lib"))) { throw "WebView2Loader.dll.lib introuvable." }
          "WEBVIEW_DIR=$sdk" >> $env:GITHUB_ENV
          Write-Host "SDK WebView2 $version prêt."
      - name: Vérifier les bibliothèques natives indispensables
        id: native
        shell: pwsh
        run: |
          $dll = "apps/desktop/composeApp/src/desktopMain/native/windows/runtime/libmpv-2.dll"
          if (Test-Path $dll) {
            "available=true" >> $env:GITHUB_OUTPUT
            "### Windows : bibliothèque MPV trouvée, compilation autorisée" >> $env:GITHUB_STEP_SUMMARY
          } else {
            "available=false" >> $env:GITHUB_OUTPUT
            Write-Host "::notice title=Windows non compilé::La DLL MPV (115 Mo) manque ; aucun MSI n'est produit. Voir apps/desktop/.kovelyx-binaries-a-sauvegarder.txt"
            "### Windows : compilation non tentée" >> $env:GITHUB_STEP_SUMMARY
            "Le binaire libmpv-2.dll (115 Mo) est absent du dépôt. Aucun MSI n'est disponible." >> $env:GITHUB_STEP_SUMMARY
          }
      - name: Compiler l'installateur MSI via Visual Studio et Gradle
        if: steps.native.outputs.available == 'true'
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "C:/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products "*" -property installationPath
          if (-not $vs) { throw "Visual Studio C++ introuvable sur le runner Windows." }
          $vsdev = Join-Path $vs "Common7/Tools/VsDevCmd.bat"
          if (-not (Test-Path $vsdev)) { throw "VsDevCmd.bat introuvable." }
          $batch = Join-Path $env:RUNNER_TEMP "kovelyx-build-msi.bat"
          @(
            "@echo off",
            "call `"$vsdev`" -arch=x64 -host_arch=x64",
            "if errorlevel 1 exit /b 1",
            "call .\\gradlew.bat :composeApp:packageReleaseMsi --no-daemon --max-workers=2 --stacktrace `"-Pnuvio.webview2.dir=$env:WEBVIEW_DIR`" `"-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m`"",
            "exit /b %errorlevel%"
          ) | Set-Content -Path $batch -Encoding ASCII
          & $batch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Enregistrer le MSI
        if: steps.native.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kovelyx-desktop-msi
          path: apps/desktop/composeApp/build/compose/binaries/**/*.msi
          if-no-files-found: error
          retention-days: 7
