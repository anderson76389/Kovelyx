name: Vérifier la parité visuelle Windows et Android

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'apps/tv/app/src/main/res/values/strings.xml'
      - 'apps/tv/app/src/main/res/values-fr/strings.xml'
      - 'scripts/tests/check-tv-french-resources.py'
      - 'scripts/tests/audit-tv-nuvio-urls.py'
      - 'apps/tv/app/src/main/java/**'
      - 'apps/tv/app/src/full/java/**'
      - 'apps/desktop/composeApp/src/commonMain/composeResources/drawable/**'
      - 'scripts/audit-kovelyx-android.py'
      - 'scripts/audit-mobile-independence.py'
      - '.github/workflows/audit-android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'scripts/audit-kovelyx-android.py'
      - 'scripts/audit-mobile-independence.py'
      - '.github/workflows/audit-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Logos, traductions, liens et noms Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Contrôler les ressources distribuées
        run: python scripts/audit-kovelyx-android.py
      - name: Vérifier les connexions Nuvio hors comptes
        run: python scripts/audit-mobile-independence.py
      - name: Vérifier la couverture française Android TV
        run: python scripts/tests/check-tv-french-resources.py
      - name: Auditer les liens réseau Nuvio dans les sources Android TV
        run: python scripts/tests/audit-tv-nuvio-urls.py
