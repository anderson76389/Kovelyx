name: Tester le moteur Media3 natif sur émulateur Android TV

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/tests/mobile-playback-nuvio-blackout.sh'
      - 'scripts/tests/tv-media3-native-instrumentation.sh'
      - '.github/workflows/media3-native-emulator.yml'
      - 'apps/tv/**'
      - 'scripts/media3/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kovelyx-tv-media3-native-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-media3:
    name: Exercices Media3 JNI et allocateur sur Google TV
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Réserver de la place pour Android et le code optimisé
        shell: bash
        run: |
          set -euo pipefail
          # Ephemeral GitHub runner only: these toolchains are unused by this Android job.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h .
      - uses: gradle/actions/setup-gradle@v4
      - name: Rendre KVM accessible
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]]; then sudo chmod 666 /dev/kvm; fi
      - name: Installer les bibliothèques Linux requises par l'émulateur
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpulse0 libnss3 libx11-6 libxkbcommon0 libxcb1 libxcomposite1 libxcursor1 libxi6 libxtst6 libxrandr2 libxdamage1 libxfixes3
      - name: Préinstaller l'émulateur avec reprises en cas d'archive SDK corrompue
        shell: bash
        run: |
          set -euo pipefail
          # Google SDK mirrors occasionally return a truncated emulator ZIP.
          # Fail visibly if three fresh downloads cannot produce an executable.
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "${SDK_ROOT}/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [[ ! -x "$SDKMANAGER" ]]; then
            echo "::error::Outil sdkmanager introuvable dans ${SDK_ROOT}/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          for attempt in 1 2 3; do
            echo "Installation de l'émulateur, essai ${attempt}/3"
            if "$SDKMANAGER" --install emulator --channel=0 && \
               test -x "${SDK_ROOT}/emulator/emulator"; then
              "${SDK_ROOT}/emulator/emulator" -version | head -n 3
              exit 0
            fi
            rm -rf "${SDK_ROOT}/emulator"
            sleep 5
          done
          echo "::error::Émulateur Android indisponible après trois téléchargements complets"
          exit 1
      - name: Tester le décodage vidéo H264 et la mémoire Media3 sur Google TV 34
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google-tv
          arch: x86
          profile: tv_1080p
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disk-size: 4096M
          disable-animations: true
          script: bash scripts/tests/tv-media3-native-instrumentation.sh
      - name: Préserver les résultats et diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kovelyx-media3-native-google-tv-results
          path: |
            apps/tv/app/build/outputs/androidTest-results/connected/**
            apps/tv/app/build/reports/androidTests/connected/**
            /tmp/kovelyx-tv-media3-diagnostics/**
          if-no-files-found: warn
          retention-days: 30
