name: Tester le moteur Media3 natif sur émulateur Android TV

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/media3-native-emulator.yml'
      - 'apps/tv/**'
      - 'scripts/media3/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kovelyx-tv-media3-native-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-media3:
    name: Exercices Media3 JNI et allocateur sur Google TV
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Rendre KVM accessible
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]]; then sudo chmod 666 /dev/kvm; fi
      - name: Exécuter les tests natifs Media3 sur Google TV 34
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google-tv
          arch: x86
          profile: tv_1080p
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disk-size: 6144M
          disable-animations: true
          script: |
            set -euo pipefail
            cd apps/tv
            chmod +x gradlew
            # Run on a real Android runtime, not merely mocked JVM classes.
            # Two native-memory lifecycle regressions plus real direct-buffer copies.
            ./gradlew :app:connectedFullDebugAndroidTest --no-daemon --max-workers=1 \
              -Pkotlin.compiler.execution.strategy=in-process \
              -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=768m" \
              -Pandroid.testInstrumentationRunnerArguments.class="androidx.media3.exoplayer.upstream.DefaultAllocatorNativeLeakTest#testDefaultAllocatorLateReleaseLeak,androidx.media3.exoplayer.upstream.DefaultAllocatorNativeTest#testAllocationAndReleaseLifecycle,androidx.media3.exoplayer.source.SampleDataQueueNativeTest"
      - name: Préserver les résultats et diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kovelyx-media3-native-google-tv-results
          path: |
            apps/tv/app/build/outputs/androidTest-results/connected/**
            apps/tv/app/build/reports/androidTests/connected/**
          if-no-files-found: warn
          retention-days: 30
