name: Publier automatiquement AppImage Linux de test

on:
  # No automatic Linux releases while Windows is the sole target.
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Numéro du run Linux compilé avec succès'
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: kovelyx-linux-release
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Vérifier le script de publication
        run: bash -n scripts/publish-linux-preview.sh
      - name: Publier uniquement les AppImages vérifiées
        env:
          GH_TOKEN: ${{ github.token }}
          LINUX_RUN_ID: ${{ github.event.workflow_run.id || inputs.build_run_id }}
        run: bash scripts/publish-linux-preview.sh
