name: Publier APK Android signes avec la cle Kovelyx permanente
# Automated for successful main APK builds only when the private signer secret exists.
# Never alter an existing Debug APK, or use an ephemeral Debug key for a Release.
on:
  workflow_run:
    workflows: ["Compiler Kovelyx (APK et diagnostic Windows)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: Plateforme a publier
        required: true
        type: choice
        options: [all, mobile, tv]
        default: all
permissions:
  contents: write
concurrency:
  group: kovelyx-signed-android-releases
  cancel-in-progress: false
jobs:
  signer-ready:
    name: Vérifier la présence du signataire permanent
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.signer.outputs.enabled }}
    steps:
      - id: signer
        shell: bash
        env:
          SIGNING_BUNDLE: ${{ secrets.KOVELYX_ANDROID_SIGNING_BUNDLE }}
        run: |
          if [[ -n "$SIGNING_BUNDLE" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Aucune clé permanente configurée : pas de publication APK release. Ajouter le secret KOVELYX_ANDROID_SIGNING_BUNDLE."
          fi

  build-and-publish:
    name: APK release signe - ${{ matrix.platform }}
    needs: signer-ready
    if: ${{ needs.signer-ready.outputs.enabled == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON((github.event_name == 'workflow_run' || inputs.platform == 'all') && '["mobile","tv"]' || format('["{0}"]', inputs.platform)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      KOVELYX_ANDROID_SIGNING_BUNDLE: ${{ secrets.KOVELYX_ANDROID_SIGNING_BUNDLE }}
      CI_SIGNED_ANDROID: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # workflow_run itself runs on the latest main; pin builds to the
          # exact already-successful source commit instead.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configurer le Worker Cloudflare Kovelyx (facultatif)
        shell: bash
        env:
          KOVELYX_CLOUDFLARE_URL: ${{ vars.KOVELYX_CLOUDFLARE_URL || 'https://kovelyx-cloud.mailpromahe.workers.dev' }}
        run: python3 scripts/configure-cloud-build.py --platform ${{ matrix.platform }}
      - name: Restaurer la signature depuis UN secret GitHub
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/restore-android-signing.py
      - name: Calculer le certificat public de la cle enregistree
        shell: bash
        run: |
          set -euo pipefail
          keytool -list -v -keystore "$RUNNER_TEMP/kovelyx-release.jks" \
            -storepass "$KOVELYX_RELEASE_STORE_PASSWORD" \
            -alias "$KOVELYX_RELEASE_KEY_ALIAS" >/tmp/kovelyx-certificat.txt
          fp="$(sed -n 's/.*SHA256: //p' /tmp/kovelyx-certificat.txt | tr -d ':[:space:]')"
          [[ "$fp" =~ ^[a-fA-F0-9]{64}$ ]] || { echo "::error::Certificat invalide"; exit 1; }
          echo "KOVELYX_ANDROID_CERT_SHA256=$fp" >> "$GITHUB_ENV"
      - name: Harmoniser la version de l'APK signe avec Windows
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 scripts/desktop-release-version.py)"
          [[ "$version" =~ ^1[.]1[.][0-9]+-(alpha|beta|rc)$ ]] || exit 1
          count="$(git rev-list --count HEAD)"
          echo "KOVELYX_BUILD_VERSION=$version" >> "$GITHUB_ENV"
          echo "KOVELYX_BUILD_CODE=$((100000 + count))" >> "$GITHUB_ENV"
      - name: Compiler le paquet release de Kovelyx
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.platform }}" == "mobile" ]]; then
            cd apps/mobile
            chmod +x gradlew
            ./gradlew :androidApp:assembleFullRelease --no-daemon --max-workers=2 \
              -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=768m" -Pkovelyx.app.versionName="$KOVELYX_BUILD_VERSION" -Pkovelyx.app.versionCode="$KOVELYX_BUILD_CODE"
          else
            cd apps/tv
            chmod +x gradlew
            ./gradlew :app:assembleFullRelease --no-daemon --max-workers=1 \
              -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=768m" -Pkovelyx.app.versionName="$KOVELYX_BUILD_VERSION" -Pkovelyx.app.versionCode="$KOVELYX_BUILD_CODE"
          fi
      - name: Conserver l'APK universel compile pour diagnostic avant publication
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.platform }}" == mobile ]]; then
            output=apps/mobile/androidApp/build/outputs/apk/full/release
          else
            output=apps/tv/app/build/outputs/apk/full/release
          fi
          echo "Fichiers APK produits pour ${{ matrix.platform }} :"
          find "$output" -maxdepth 1 -type f -name '*.apk' -printf '%f (%s octets)\\n' | sort
          mkdir -p diagnostic-apk
          while IFS= read -r -d '' apk; do
            cp "$apk" "diagnostic-apk/"
          done < <(find "$output" -maxdepth 1 -type f -iname '*universal*.apk' -print0)
          if ! compgen -G 'diagnostic-apk/*.apk' > /dev/null; then
            echo "::error::Aucun APK universel produit : verifier les splits ABI et les noms de fichiers ci-dessus."
            exit 1
          fi
      - name: Sauvegarder l'APK universel compile, meme si les controles suivants echouent
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: kovelyx-${{ matrix.platform }}-apk-non-verifie-diagnostic
          path: diagnostic-apk/*.apk
          if-no-files-found: ignore
          retention-days: 7
      - name: Valider package, signatures, empreinte de certificat et identite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ "${{ matrix.platform }}" == mobile ]]; then
            output=apps/mobile/androidApp/build/outputs/apk/full/release
            application_id=com.kovelyx.mobile
            prefix=Kovelyx-Android
          else
            output=apps/tv/app/build/outputs/apk/full/release
            application_id=com.kovelyx.tv
            prefix=Kovelyx-TV
          fi
          mapfile -d '' apks < <(find "$output" -maxdepth 1 -type f -iname '*universal*.apk' -print0)
          [[ "${{ matrix.platform }}" == mobile || "${{ matrix.platform }}" == tv ]] || exit 1
          [[ "${#apks[@]}" == 1 ]] || { echo "::error::Il faut un seul APK universel dans $output : ${#apks[@]} trouves"; ls -lh "$output"; exit 1; }
          apk="${apks[0]}"
          unzip -tq "$apk"
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          # Un build Gradle peut accidentellement conserver une signature de test.
          # Resigner explicitement avec la cle permanente du secret GitHub.
          # Le certificat FINAL doit etre identique a celui de cette cle.
          signed="$RUNNER_TEMP/kovelyx-${{ matrix.platform }}-permanent.apk"
          "$tools/apksigner" sign \
            --ks "$KOVELYX_RELEASE_STORE_FILE" \
            --ks-key-alias "$KOVELYX_RELEASE_KEY_ALIAS" \
            --ks-pass env:KOVELYX_RELEASE_STORE_PASSWORD \
            --key-pass env:KOVELYX_RELEASE_KEY_PASSWORD \
            --out "$signed" "$apk"
          apk="$signed"
          "$tools/apksigner" verify --verbose "$apk" >/dev/null
          "$tools/apksigner" verify --print-certs "$apk" > /tmp/kv-signer.txt
          # AOSP apksigner can vary spaces and output formatting across
          # build-tools versions. Normalize ONLY the public certificate digest;
          # never weaken the equality check against the private keystore.
          actual="$(sed -nE 's/.*[Ss]igner #[0-9]+ certificate SHA-256 digest:[[:space:]]*([[:xdigit:]:]+).*/\1/p' /tmp/kv-signer.txt | head -n1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          expected="$(printf '%s' "$KOVELYX_ANDROID_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$actual" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Empreinte SHA-256 du signataire APK introuvable ou mal formee."
            # Certificate subject/digest are public metadata; never dump the
            # keystore, credentials or signing command environment.
            grep -E 'Signer #[0-9]+ certificate (DN|SHA-256 digest):' /tmp/kv-signer.txt || true
            exit 1
          fi
          if [[ ! "$expected" =~ ^[0-9a-f]{64}$ || "$actual" != "$expected" ]]; then
            echo "::error::Certificat final APK different de la cle permanente ; publication interdite."
            echo "Certificat APK (debut): ${actual:0:16} ; certificat JKS (debut): ${expected:0:16}"
            exit 1
          fi
          echo "Certificat permanent verifie sur le fichier APK final."
          "$tools/aapt" dump badging "$apk" > /tmp/kv-badging.txt
          grep -F "package: name='$application_id'" /tmp/kv-badging.txt
          version_name="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" /tmp/kv-badging.txt | head -n1)"
          version_code="$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" /tmp/kv-badging.txt | head -n1)"
          [[ "$version_name" == "$KOVELYX_BUILD_VERSION" && "$version_code" == "$KOVELYX_BUILD_CODE" ]] || {
            echo "::error::Version signee differente de la Release commune"
            exit 1
          }
          [[ "$version_name" =~ ^[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z.-]+)?$ && "$version_code" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::Version Android non conforme au format SemVer"; exit 1;
          }
          if [[ "${{ matrix.platform }}" == "mobile" ]]; then
            tag="android-v$version_name"
          else
            tag="tv-v$version_name"
          fi
          file="$prefix-$tag-universal.apk"
          cp "$apk" "dist/$file"
          (cd dist && sha256sum "$file" > "$file.sha256")
          {
            echo "KOVELYX_RELEASE_TAG=$tag"
            echo "KOVELYX_RELEASE_APK=$file"
            echo "KOVELYX_RELEASE_VERSION_CODE=$version_code"
          } >> "$GITHUB_ENV"
          echo "APK : $file (versionCode $version_code), certificat identique a l'empreinte privee en secret." >> "$GITHUB_STEP_SUMMARY"
      - name: Publier la version signee seulement si le depot l'autorise
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.KOVELYX_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          tag="$KOVELYX_RELEASE_TAG"
          file="$KOVELYX_RELEASE_APK"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_pre="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)"
            [[ "$is_pre" == true ]] || { echo "::error::Release stable existante : aucun changement automatique"; exit 1; }
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$file"; then
              echo "::error::Cette version APK existe deja. Incrementez versionName et versionCode avant un nouveau build."
              exit 1
            fi
            gh release upload "$tag" "dist/$file" "dist/$file.sha256" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "dist/$file" "dist/$file.sha256" --repo "$GITHUB_REPOSITORY" \
              --target "$(git rev-parse HEAD)" --title "Kovelyx Android signe - $tag" --prerelease \
              --notes "APK Release signe avec le certificat Kovelyx permanent. VersionCode : $KOVELYX_RELEASE_VERSION_CODE. Preversion : tests reels et sauvegarde recommandes. Versions Debug anterieures non compatibles avec une mise a jour directe."
          fi
          echo "Release signee disponible : https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
      - name: Sauvegarder les APK signes si GitHub renvoie HTTP 403
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: kovelyx-signed-${{ matrix.platform }}-backup
          path: |
            dist/*.apk
            dist/*.apk.sha256
          if-no-files-found: ignore
          retention-days: 7
      - name: Supprimer la copie locale de la cle du runner
        if: ${{ always() }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/kovelyx-release.jks"
