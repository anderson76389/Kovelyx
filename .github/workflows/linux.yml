name: Kovelyx Linux - packages et tests

on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'apps/mobile/**'
      - 'apps/tv/**'
      - 'scripts/media3/**'
      - 'scripts/player/**'
      - 'scripts/sign-ci-debug-apk.sh'
      - 'scripts/publish-unified-preview.sh'
      - '.github/workflows/build.yml'
      - '.github/workflows/windows.yml'
      - 'vendor/engine/**'
      - 'scripts/desktop-release-version.py'
      - 'scripts/generate-windows-icon.py'
      - 'scripts/generate-compose-brand.py'
      - 'scripts/publish-verified-preview.py'
      - 'scripts/package-linux-release.sh'
      - 'scripts/tests/test_verified_preview.py'
      - '.github/workflows/linux.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'apps/mobile/**'
      - 'apps/tv/**'
      - 'scripts/media3/**'
      - 'scripts/player/**'
      - 'scripts/sign-ci-debug-apk.sh'
      - 'scripts/publish-unified-preview.sh'
      - '.github/workflows/build.yml'
      - '.github/workflows/windows.yml'
      - 'vendor/engine/**'
      - 'scripts/desktop-release-version.py'
      - 'scripts/publish-verified-preview.py'
      - 'scripts/package-linux-release.sh'
      - 'scripts/tests/test_verified_preview.py'
      - '.github/workflows/linux.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kovelyx-linux-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: Compiler Kovelyx Linux x86_64 - AppImage DEB RPM
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Récupérer le code complet
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configuration Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Installer les bibliothèques Linux et outils de packaging
        shell: bash
        run: |
          set -euo pipefail
          bash apps/desktop/scripts/linux/install-desktop-build-dependencies.sh \
            rpm rpm2cpio cpio fakeroot libwebkit2gtk-4.1-0 libmpv2 \
            libxcomposite1 libxext6 gstreamer1.0-plugins-good gstreamer1.0-libav \
            glib-networking squashfs-tools desktop-file-utils

      - name: Version commune des quatre plateformes
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 scripts/desktop-release-version.py)"
          [[ "$version" =~ ^1[.]1[.][0-9]+(-(alpha|beta|rc))?$ ]] || exit 1
          echo "KOVELYX_BUILD_VERSION=$version" >> "$GITHUB_ENV"
          echo "Linux x86_64 version $version" >> "$GITHUB_STEP_SUMMARY"

      - name: Reconstruire et contrôler le moteur JVM depuis ce dépôt
        shell: bash
        run: |
          set -euo pipefail
          chmod +x apps/desktop/gradlew
          apps/desktop/gradlew -p vendor/engine/platform/jvm jar --no-daemon --max-workers=2
          jar_new=vendor/engine/platform/jvm/build/libs/nuvio-engine-jvm-0.1.4.jar
          jar_old=apps/desktop/composeApp/libs/kovelyx-engine-jvm-0.1.4.jar
          test -s "$jar_new"
          test -s "$jar_old"
          jar tf "$jar_old" | grep '[.]class$' | sort -u > /tmp/kovelyx-jar-old.txt
          jar tf "$jar_new" | grep '[.]class$' | sort -u > /tmp/kovelyx-jar-new.txt
          if comm -23 /tmp/kovelyx-jar-old.txt /tmp/kovelyx-jar-new.txt | grep .; then
            echo "::error::Classes natives de l'ancien moteur absentes dans les sources reconstruites"
            exit 1
          fi
          cp -- "$jar_new" "$jar_old"

      - name: Générer les icônes et ressources à l'identité Kovelyx
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'Pillow==11.3.0'
          python3 scripts/generate-windows-icon.py --dest apps/desktop/composeApp/src/desktopMain/resources/icons
          python3 scripts/generate-compose-brand.py --project apps/desktop
          test -s apps/desktop/composeApp/src/desktopMain/resources/icons/kovelyx.png

      - name: Configurer la même URL de comptes que la version Windows
        shell: bash
        env:
          KOVELYX_CLOUDFLARE_URL: ${{ vars.KOVELYX_CLOUDFLARE_URL || 'https://kovelyx-cloud.mailpromahe.workers.dev' }}
        run: python3 scripts/configure-cloud-build.py --platform desktop

      - name: Préparer appimagetool
        shell: bash
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/appimagetool-x86_64.AppImage"
          curl --fail --location --retry 3 --connect-timeout 20 \
            'https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage' \
            --output "$tool"
          echo "e8c1169c4af66c3184d7ee110713d4be04befe671fa358e2c1591ee840553b03  $tool" | sha256sum -c -
          test "$(head -c 4 "$tool" | od -An -tx1 | tr -d '[:space:]')" = 7f454c46
          chmod +x "$tool"
          echo "APPIMAGETOOL=$tool" >> "$GITHUB_ENV"

      - name: Vérifier les outils locaux avant packaging
        shell: bash
        run: |
          set -euo pipefail
          chmod +x apps/desktop/scripts/linux/*.sh
          bash -n scripts/package-linux-release.sh
          bash -n apps/desktop/scripts/linux/build-appimage.sh
          bash -n apps/desktop/scripts/linux/patch-linux-deb.sh
          bash -n apps/desktop/scripts/linux/patch-linux-rpm.sh
          bash apps/desktop/scripts/linux/test-linux-deb-tools.sh

      - name: Compiler les tests Desktop et les trois distributions Linux
        working-directory: apps/desktop
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1920x1080x24' ./gradlew \
            :composeApp:desktopTest \
            :composeApp:packageReleaseDeb \
            :composeApp:packageReleaseRpm \
            :composeApp:packageReleaseAppImage \
            --no-configuration-cache --no-daemon --max-workers=2 --stacktrace \
            "-Pnuvio.desktop.versionName=$KOVELYX_BUILD_VERSION" \
            '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m'

      - name: Vérifier le contenu et préparer les artefacts Linux
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/package-linux-release.sh "$KOVELYX_BUILD_VERSION" \
            apps/desktop/composeApp/build/compose/binaries/main-release \
            apps/desktop/composeApp/build/compose/release-appimages \
            "$RUNNER_TEMP/kovelyx-linux"

      - name: Publier les trois paquets testés dans les artefacts du commit
        uses: actions/upload-artifact@v4
        with:
          name: kovelyx-linux-packages
          path: ${{ runner.temp }}/kovelyx-linux/
          if-no-files-found: error
          retention-days: 30
