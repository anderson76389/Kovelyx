name: Diagnostic complet retrait SIMKL
on:
  push:
    branches:
      - maintenance/suppression-complete-simkl
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventorier les références réelles de SIMKL
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, collections
          paths = subprocess.check_output(["git","ls-files"], text=True).splitlines()
          refs = []
          for name in paths:
              p = pathlib.Path(name)
              if p.suffix.lower() not in {".kt",".kts",".xml",".yml",".yaml",".py",".md",".json",".properties",".swift",".java",".gradle",".toml"}: continue
              try: text = p.read_text(encoding="utf8")
              except (UnicodeDecodeError, OSError): continue
              lines = [i for i,x in enumerate(text.splitlines(),1) if "simkl" in x.lower()]
              if lines: refs.append((name,len(lines),lines[:9]))
          named = [p for p in paths if "simkl" in p.lower()]
          callers = [(p,n,ex) for p,n,ex in refs if "simkl" not in p.lower()]
          print("SIMKL_TOTAL_PATHS_WITH_NAME:", len(named))
          print("SIMKL_TOTAL_FILE_REFERENCES:", len(refs))
          print("SIMKL_CALLERS_OUTSIDE_NAMED_FILES:", len(callers))
          print("SIMKL_CALLER_START")
          for p,n,ex in sorted(callers, key=lambda x:x[0]): print(f"{p} | {n} lignes | exemples {ex}")
          print("SIMKL_CALLER_END")
          print("SIMKL_NAMED_FILES_START")
          for p in sorted(named): print(p)
          print("SIMKL_NAMED_FILES_END")
          PY
