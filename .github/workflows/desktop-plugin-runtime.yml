name: Tester rapidement les extensions natives Windows
on:
  workflow_dispatch:
  push:
    branches: [main, fix/cloudflare-network-status-and-settings]
    paths:
      - 'apps/desktop/composeApp/src/fullCommonMain/kotlin/com/kovelyx/app/features/plugins/**'
      - 'apps/desktop/composeApp/src/desktopMain/kotlin/com/kovelyx/app/features/plugins/**'
      - 'apps/desktop/composeApp/src/desktopTest/kotlin/com/kovelyx/app/features/plugins/**'
      - '.github/workflows/desktop-plugin-runtime.yml'
permissions:
  contents: read
concurrency:
  group: kovelyx-desktop-plugin-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Exécuter les vrais scrapers et formulaires asynchrones en concurrence
        working-directory: apps/desktop
        shell: pwsh
        run: ./gradlew.bat :composeApp:desktopTest --tests '*PluginRuntimeDesktopTest*' --no-daemon --no-configuration-cache -x :composeApp:buildWindowsPlayerBridge --max-workers=2 '-Pkotlin.compiler.execution.strategy=in-process' '-Dorg.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=768m'
      - name: Afficher les échecs éventuels des tests
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem apps/desktop/composeApp/build/test-results/desktopTest -Filter '*.xml' -ErrorAction SilentlyContinue | ForEach-Object {
            [xml]$report = Get-Content $_.FullName -Raw
            $report.testsuite.testcase | Where-Object { $_.failure } | ForEach-Object {
              Write-Output $_.name
              Write-Output $_.failure.InnerText
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kovelyx-desktop-plugin-runtime-report
          path: apps/desktop/composeApp/build/reports/tests/desktopTest/
          retention-days: 30
