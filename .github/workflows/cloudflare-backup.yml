name: Sauvegarder les comptes et médias D1 (copie chiffrée vérifiée)
on:
  schedule:
    - cron: '40 3 * * *'
  push:
    branches: [main, fix/cloudflare-network-status-and-settings]
    paths: ['.github/workflows/cloudflare-backup.yml', 'services/kovelyx-cloudflare/scripts/backup-remote.py', 'services/kovelyx-cloudflare/scripts/backup_validation.py', 'services/kovelyx-cloudflare/scripts/verify-private-backup.py']
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-backup.yml'
      - 'services/kovelyx-cloudflare/scripts/backup-remote.py'
      - 'services/kovelyx-cloudflare/scripts/backup_validation.py'
      - 'services/kovelyx-cloudflare/scripts/verify-private-backup.py'
      - 'services/kovelyx-cloudflare/tests/test_backup_validation.py'
      - 'services/kovelyx-cloudflare/tests/test_private_backup_rehearsal.py'
      - 'scripts/tests/test_private_logging_boundaries.py'
      - 'scripts/tests/audit_network_surface.py'
      - 'apps/**/SentryInitializer.kt'
      - 'apps/**/SentryEventSanitizer.kt'
      - 'apps/**/SentryNetworkBreadcrumbInterceptor.kt'
      - 'apps/tv/app/src/main/java/com/kovelyx/tv/core/logging/LogDiagnostics.kt'
      - 'apps/tv/app/src/main/java/com/kovelyx/tv/ui/screens/player/LoggingDataSource.kt'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kovelyx-encrypted-d1-backup
  cancel-in-progress: false
jobs:
  verify:
    name: Vérifier sauvegarde chiffrée, restauration D1 et confidentialité sans production
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tester un chiffrement et une restauration avec des clés jetables
        run: |
          set -euo pipefail
          python3 -m py_compile services/kovelyx-cloudflare/scripts/backup_validation.py services/kovelyx-cloudflare/scripts/backup-remote.py services/kovelyx-cloudflare/scripts/verify-private-backup.py
          python3 services/kovelyx-cloudflare/tests/test_backup_validation.py
          python3 services/kovelyx-cloudflare/tests/test_private_backup_rehearsal.py
          python3 scripts/tests/test_private_logging_boundaries.py
          python3 scripts/tests/audit_network_surface.py > /tmp/kovelyx-network-categories.json
      - name: Conserver seulement un inventaire des catégories, jamais les URLs ni les jetons
        uses: actions/upload-artifact@v4
        with:
          name: kovelyx-network-source-categories
          path: /tmp/kovelyx-network-categories.json
          if-no-files-found: error
          retention-days: 30
  backup:
    needs: verify
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer les outils et tester le Worker hors production
        working-directory: services/kovelyx-cloudflare
        run: |
          npm ci --no-audit --no-fund
          npm test
          python3 tests/check-d1-schema.py
          python3 tests/test_backup_validation.py
      - name: Exporter et chiffrer la base existante sans modifier les comptes
        env:
          KOVELYX_ANDROID_SIGNING_BUNDLE: ${{ secrets.KOVELYX_ANDROID_SIGNING_BUNDLE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KOVELYX_D1_DATABASE_ID: ${{ vars.KOVELYX_D1_DATABASE_ID || secrets.KOVELYX_D1_DATABASE_ID }}
          BACKUP_OUTPUT_DIR: ${{ runner.temp }}/kovelyx-encrypted-backup
          WRANGLER_SEND_METRICS: 'false'
        run: python3 services/kovelyx-cloudflare/scripts/backup-remote.py
      - name: Conserver uniquement la copie chiffrée et les contrôles non privés
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kovelyx-d1-encrypted-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/kovelyx-encrypted-backup/
          if-no-files-found: error
          retention-days: 90
