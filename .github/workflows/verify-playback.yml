name: Vérifier la lecture réelle Windows publiée
on:
  push:
    branches: [main, fix/cloudflare-network-status-and-settings]
    paths:
      - 'scripts/player/**'
      - 'tests/fixtures/windows-playback-1080p.mp4.b64'
      - '.github/workflows/verify-playback.yml'
  pull_request:
    branches: [main]
    paths: ['.github/workflows/verify-playback.yml', 'scripts/player/**', 'tests/fixtures/windows-playback-1080p.mp4.b64']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Télécharger la dernière distribution Windows complète
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Latest Release unavailable' }
          $dest = Join-Path $env:RUNNER_TEMP 'kovelyx-release-playback'
          New-Item -ItemType Directory -Force $dest | Out-Null
          $name = "Kovelyx-Windows-Setup-$($release.tag_name).exe"
          gh release download $release.tag_name --repo $env:GITHUB_REPOSITORY --pattern $name --pattern "$name.sha256" --dir $dest
          if ($LASTEXITCODE -ne 0) { throw 'Release download failed' }
          $setup = Join-Path $dest $name
          $expected = ((Get-Content "$setup.sha256" -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash $setup -Algorithm SHA256).Hash -ne $expected) { throw 'Release checksum mismatch' }
          $install = Start-Process -FilePath $setup -ArgumentList '/quiet', '/norestart' -Wait -PassThru
          if ($install.ExitCode -notin @(0, 3010)) { throw "Installer returned $($install.ExitCode)" }
          $app = Join-Path $env:ProgramFiles 'Kovelyx'
          if (-not (Test-Path (Join-Path $app 'Kovelyx.exe'))) { throw 'Installed Kovelyx.exe missing' }
          "PLAYBACK_APP_ROOT=$app" >> $env:GITHUB_ENV
          "Release exercised: $($release.tag_name)" >> $env:GITHUB_STEP_SUMMARY
      - name: Bloquer Nuvio avant de lire le MP4 du lecteur Windows publié
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hostsFile = Join-Path $env:WINDIR 'System32\drivers\etc\hosts'
          foreach ($hostName in @('nuvio.tv', 'api.nuvio.tv', 'auth.nuvio.tv', 'cdn.nuvio.tv', 'www.nuvio.tv', 'nuvioapp.space')) {
            Add-Content -LiteralPath $hostsFile -Value "127.0.0.1 $hostName"
          }
          git config --global url.https://blocked-upstream.invalid/NuvioMedia/.insteadOf https://github.com/NuvioMedia/
          $addresses = @([System.Net.Dns]::GetHostAddresses('api.nuvio.tv') | ForEach-Object { $_.ToString() })
          if ($addresses.Count -eq 0 -or @($addresses | Where-Object { $_ -ne '127.0.0.1' }).Count -gt 0) {
            throw 'Le DNS Nuvio n est pas neutralisé sur le runner Windows.'
          }
      - name: Lire un MP4 avec le lecteur natif réellement livré
        shell: pwsh
        run: ./scripts/player/test-windows-playback.ps1 -AppRoot $env:PLAYBACK_APP_ROOT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-playback
          path: ${{ runner.temp }}/kovelyx-native-playback/
          retention-days: 14
