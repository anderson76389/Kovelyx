name: Publier le site Kovelyx (branche gh-pages)

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kovelyx-gh-pages
  cancel-in-progress: true

jobs:
  publish:
    name: Synchroniser docs vers gh-pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt et la branche du site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Vérifier les ressources du site
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/index.html
          test -s docs/site.js
          test -s docs/site.css
          test -s docs/brand/logo.svg
          test -s docs/brand/banner.svg
          node --check docs/site.js
          grep -q 'api.github.com/repos/' docs/site.js

      - name: Synchroniser les fichiers statiques
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          SITE_DIR="$RUNNER_TEMP/kovelyx-pages"
          git worktree add --detach "$SITE_DIR" FETCH_HEAD
          find "$SITE_DIR" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a docs/. "$SITE_DIR/"
          touch "$SITE_DIR/.nojekyll"
          git -C "$SITE_DIR" add -A
          if git -C "$SITE_DIR" diff --cached --quiet; then
            echo "Le site gh-pages est déjà à jour."
          else
            git -C "$SITE_DIR" commit -m "site: met à jour les fichiers depuis main/docs"
            git -C "$SITE_DIR" push origin HEAD:gh-pages
          fi
          test -s "$SITE_DIR/index.html"
          echo "Les fichiers du site sont publiés dans la branche gh-pages."
          echo "Une seule activation manuelle est nécessaire : Settings > Pages > Deploy from a branch > gh-pages > /(root)."
