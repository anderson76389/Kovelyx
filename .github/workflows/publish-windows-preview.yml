name: Publier automatiquement les EXE de test Windows

on:
  workflow_run:
    workflows:
      - "Kovelyx Windows - MSI et tests de packaging"
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Identifiant de compilation Windows réussie (vide : dernière compilation)'
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: kovelyx-windows-prereleases
  cancel-in-progress: false

jobs:
  publish:
    name: Mettre le Setup.exe directement dans Releases
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Sources du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Vérifier les scripts et notices
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/publish-windows-preview.sh
          test -s docs/PROVENANCE.md
          test -s apps/desktop/README.md
      - name: Publier une préversion basée sur un build réussi
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.KOVELYX_RELEASE_TOKEN || github.token }}
          BUILD_RUN_ID: ${{ github.event.workflow_run.id || inputs.build_run_id || '' }}
        run: bash scripts/publish-windows-preview.sh

      - name: Publier la preuve exacte de la Release Windows
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: kovelyx-windows-release-proof
          path: dist/kovelyx-windows-release-proof.json
          if-no-files-found: error
          retention-days: 90

      # La publication en Releases peut être refusée (HTTP 403) même quand
      # les installateurs sont valides. Ne pas jeter ces fichiers vérifiés.
      - name: Conserver les installateurs si GitHub bloque la Release
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: kovelyx-windows-publication-secours
          path: |
            dist/*.exe
            dist/*.exe.sha256
            dist/*.msi
            dist/*.msi.sha256
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: ignore
          retention-days: 7
