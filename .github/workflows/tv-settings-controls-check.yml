name: Vérifier les paramètres Android TV et la télécommande

on:
  pull_request:
    branches: [main]
    paths:
      - 'shared/**'
      - 'apps/tv/**'
      - '.github/workflows/tv-settings-controls-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kovelyx-tv-settings-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tv-settings:
    name: Tests Kotlin TV, réglages et compilation APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configurer Kovelyx Cloudflare pour la TV
        env:
          KOVELYX_CLOUDFLARE_URL: ${{ vars.KOVELYX_CLOUDFLARE_URL || 'https://kovelyx-cloud.mailpromahe.workers.dev' }}
        run: python3 scripts/configure-cloud-build.py --platform tv
      - name: Vérifier tous les tests Kotlin TV
        working-directory: apps/tv
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:testFullDebugUnitTest --no-daemon --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=768m"
      - name: Compiler la véritable APK TV
        working-directory: apps/tv
        shell: bash
        run: |
          ./gradlew :app:assembleFullDebug --no-daemon --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=768m"
      - name: Activer KVM pour l'émulateur Google TV
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "::warning::/dev/kvm indisponible sur ce runner; émulation logicielle plus lente"
          fi
      - name: Exécuter les vrais contrôles des paramètres sur Google TV avec télécommande
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google-tv
          arch: x86
          profile: tv_1080p
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disk-size: 6144M
          disable-animations: true
          script: |
            bash -c 'cd apps/tv && ./gradlew :app:connectedFullDebugAndroidTest --no-daemon --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=768m" -Pandroid.testInstrumentationRunnerArguments.class=com.kovelyx.tv.ui.screens.settings.SettingsRailRemoteNavigationTest,com.kovelyx.tv.ui.screens.settings.PlaybackSettingsOrganizationTest,com.kovelyx.tv.ui.screens.settings.TrackingSettingsOverviewTest'
      - name: Conserver les rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-parametres-kovelyx-tv
          path: |
            apps/tv/app/build/reports/tests/testFullDebugUnitTest/
            apps/tv/app/build/reports/androidTests/connected/
            apps/tv/app/build/outputs/androidTest-results/connected/
            apps/tv/app/build/outputs/apk/full/debug/
          if-no-files-found: ignore
