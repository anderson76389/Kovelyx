name: Lire les diagnostics du test concurrent Windows
on:
  workflow_dispatch:
  push:
    branches: [fix/cloudflare-network-status-and-settings]
    paths: ['.github/workflows/desktop-test-diagnostics.yml']
permissions:
  actions: read
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Lire le rapport déjà produit sans reconstruire les applications
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 41684878516 --repo anderson76389/Kovelyx --name Kovelyx-Windows-test-reports --dir reports
          python3 - <<'PY'
          from pathlib import Path
          import re, html
          for path in Path('reports').rglob('*.html'):
              text = path.read_text(errors='replace')
              if 'desktop runtime handles concurrent scraper executions' in text and 'TimeoutCancellationException' in text:
                  print(str(path))
                  text = re.sub(r'<(?:script|style)\b[^>]*>.*?</(?:script|style)>', '', text, flags=re.S)
                  print(html.unescape(re.sub('<[^>]+>', '', text))[:30000])
          PY
