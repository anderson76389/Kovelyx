name: Préserver le runtime vidéo Windows (depuis Kovelyx)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-windows.yml'
      - 'scripts/restore-windows-mpv.ps1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kovelyx-windows-runtime-backup
  cancel-in-progress: false

jobs:
  verify-native:
    name: Archiver la DLL MPV vérifiée depuis une Release Kovelyx
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restaurer sans accès aux dépôts Nuvio
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          ./scripts/restore-windows-mpv.ps1
          $dll = 'apps/desktop/composeApp/src/desktopMain/native/windows/runtime/libmpv-2.dll'
          $hash = (Get-FileHash $dll -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '07c68bb211f23a218ded0a36eb12207dc3aeb44e5318ffca6ce9dcc7c3173906') {
            throw "Runtime vidéo incompatible."
          }
          New-Item -ItemType Directory -Force -Path output | Out-Null
          Copy-Item -LiteralPath $dll -Destination output/libmpv-2.dll
          @'
          Source: GitHub Releases anderson76389/Kovelyx (archive portable Windows).
          SHA-256: 07c68bb211f23a218ded0a36eb12207dc3aeb44e5318ffca6ce9dcc7c3173906
          Taille: 115320296 octets
          Restauration vérifiée, sans téléchargement depuis NuvioMedia.
          IMPORTANT: ce n'est pas une reconstruction du code source libmpv.
          Vérifier et préserver les licences ainsi que les sources des dépendances natives.
          '@ | Set-Content output/PROVENANCE.txt -Encoding UTF8
          "### Runtime vérifié depuis les Releases Kovelyx" >> $env:GITHUB_STEP_SUMMARY
      - name: Archiver dans Kovelyx (sauvegarde renouvelable)
        uses: actions/upload-artifact@v4
        with:
          name: kovelyx-windows-mpv
          path: output/
          retention-days: 90
          if-no-files-found: error
