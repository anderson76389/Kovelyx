name: Diagnostiquer la synchronisation Cloudflare déployée (lecture seule)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cloudflare-readiness.yml'
      - 'services/kovelyx-cloudflare/src/catalogue-sync.mjs'
      - 'services/kovelyx-cloudflare/src/index.mjs'

permissions:
  contents: read

jobs:
  readiness:
    name: Vérifier la migration D1 en production sans toucher aux comptes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KOVELYX_CLOUDFLARE_URL: ${{ vars.KOVELYX_CLOUDFLARE_URL || 'https://kovelyx-cloud.mailpromahe.workers.dev' }}
    steps:
      - name: Vérifier Cloudflare, catalogues et schémas sans toucher aux comptes
        shell: bash
        run: |
          set -euo pipefail
          url="${KOVELYX_CLOUDFLARE_URL%/}/ready"
          code="$(curl --silent --show-error --location --max-time 25 --connect-timeout 10 \
            -H 'Accept: application/json' -o /tmp/kovelyx-cloud-ready.json -w '%{http_code}' "$url")"
          if [[ "$code" != "200" ]]; then
            echo "::error::Kovelyx Cloudflare n'est pas prêt (HTTP $code). Vérifier déploiement Worker, migration D1 0004 et secret Better Auth. Aucun compte n'a été modifié."
            exit 1
          fi
          python3 - <<'PY'
          import json
          with open('/tmp/kovelyx-cloud-ready.json', encoding='utf-8') as file:
              result = json.load(file)
          assert result.get('service') == 'Kovelyx Cloud', 'Service inattendu'
          assert result.get('provider') == 'Cloudflare D1', 'Mauvais backend'
          assert result.get('status') == 'ok', 'Backend non prêt'
          assert result.get('schema') == '0004_profile_media_gifs', 'Migration images de profil non vérifiée'
          missing = []
          if result.get('profilePinSchema') != 1:
              missing.append('Migration PIN Cloudflare absente')
          if result.get('catalogueSnapshotSchema') != 1:
              missing.append('Protocole catalogueSnapshotSchema: 1 absent')
          if missing:
              for item in missing:
                  print('ERREUR PRODUCTION : ' + item)
              raise AssertionError('Worker Kovelyx de production obsolète : déployer le code actuel après sauvegarde D1 sans supprimer les comptes.')
          print('OK : Better Auth, D1 0004, PIN et protocole de synchronisation des catalogues détectés.')
          print('Ce diagnostic ne prouve pas encore la synchronisation entre appareils physiques.')
          PY
          echo '✅ Worker, D1 et protocole catalogues compatibles. Les connexions réelles multi-appareils restent à tester.' >> "$GITHUB_STEP_SUMMARY"
