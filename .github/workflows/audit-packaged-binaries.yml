name: Inspecter les DLL et bibliotheques Android pour des dependances Nuvio

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-packaged-binaries.yml'
      - 'scripts/tests/audit-packaged-binaries.py'
      - 'apps/**/libs/**'
      - 'apps/desktop/composeApp/src/desktopMain/native/windows/engine/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binary-audit:
    name: Scanner les DLL, AAR et JAR du depot Kovelyx
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rechercher les domaines amont dans les binaires locaux
        shell: bash
        run: |
          set -o pipefail
          python scripts/tests/audit-packaged-binaries.py | tee /tmp/kovelyx-binary-audit.txt
      - name: Archiver le rapport brut meme si une dependance est detectee
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kovelyx-audit-binaries-natifs
          path: /tmp/kovelyx-binary-audit.txt
          if-no-files-found: ignore
          retention-days: 60
