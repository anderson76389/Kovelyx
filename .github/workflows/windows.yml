name: Kovelyx Windows - MSI et tests de packaging

on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - '!apps/desktop/**/*.md'
      - 'vendor/engine/**'
      - 'scripts/generate-windows-icon.py'
      - 'scripts/generate-compose-brand.py'
      - 'scripts/desktop-release-version.py'
      - '.github/workflows/windows.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'vendor/engine/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: kovelyx-windows-${{ github.ref }}
  # The packaging job can take >30 min; preserve it for a useful diagnostic.
  cancel-in-progress: false

jobs:
  desktop:
    name: Compiler Kovelyx Windows
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Sources Kovelyx
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configurer le Worker Cloudflare Kovelyx dans Windows (facultatif)
        shell: pwsh
        env:
          KOVELYX_CLOUDFLARE_URL: ${{ vars.KOVELYX_CLOUDFLARE_URL }}
        run: python scripts/configure-cloud-build.py --platform desktop
      - name: Version de la compilation Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = python scripts/desktop-release-version.py
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+-(alpha|beta|rc)$') {
            throw 'Version de la compilation invalide'
          }
          "KOVELYX_BUILD_VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "Kovelyx Windows version $version"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Reconstruire le moteur JVM depuis vendor/engine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & apps/desktop/gradlew.bat -p vendor/engine/platform/jvm jar --no-daemon --stacktrace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $newJar = 'vendor/engine/platform/jvm/build/libs/nuvio-engine-jvm-0.1.4.jar'
          $oldJar = 'apps/desktop/composeApp/libs/nuvio-engine-jvm-0.1.4.jar'
          if (-not (Test-Path $newJar) -or -not (Test-Path $oldJar)) { throw 'JAR du moteur manquant' }
          $oldClasses = @( & jar tf $oldJar | Where-Object { $_ -match '[.]class$' } )
          $newClasses = @( & jar tf $newJar | Where-Object { $_ -match '[.]class$' } )
          $missing = @($oldClasses | Where-Object { $_ -notin $newClasses })
          if ($missing.Count -gt 0) { throw ('Classes du moteur manquantes : ' + ($missing -join ', ')) }
          Copy-Item -Path $newJar -Destination $oldJar -Force
          Write-Host 'JAR JVM recompilé et contrôlé depuis le dépôt Kovelyx.'
      - name: Générer l'icône Kovelyx originale
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check 'Pillow==11.3.0'
          python scripts/generate-windows-icon.py --dest apps/desktop/composeApp/src/desktopMain/resources/icons
          python scripts/generate-compose-brand.py --project apps/desktop
          if ($LASTEXITCODE -ne 0) { throw 'Génération des logos Kovelyx en échec' }
          if (-not (Test-Path 'apps/desktop/composeApp/src/desktopMain/resources/icons/kovelyx.ico')) { throw 'ICO Kovelyx manquant' }
          if (-not (Test-Path 'apps/desktop/composeApp/src/commonMain/composeResources/drawable/app_logo_wordmark_original.png')) { throw 'Wordmark Kovelyx manquant' }
      - name: Restaurer la DLL MPV depuis Kovelyx uniquement
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $expected = '07c68bb211f23a218ded0a36eb12207dc3aeb44e5318ffca6ce9dcc7c3173906'
          $dst = 'apps/desktop/composeApp/src/desktopMain/native/windows/runtime'
          $restored = $false
          # Chemin rapide : sauvegarde temporaire produite par notre workflow.
          $runsJson = & gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/native-windows.yml/runs?branch=main&status=success&per_page=10"
          if ($LASTEXITCODE -eq 0) {
            $runs = $runsJson | ConvertFrom-Json
            $success = @($runs.workflow_runs | Where-Object { $_.conclusion -eq 'success' } | Select-Object -First 1)
            if ($success.Count -eq 1) {
              $root = Join-Path $env:RUNNER_TEMP 'kovelyx-mpv'
              New-Item -ItemType Directory -Force -Path $root | Out-Null
              & gh run download $success[0].id --repo $env:GITHUB_REPOSITORY --name kovelyx-windows-mpv --dir $root
              $dll = Join-Path $root 'libmpv-2.dll'
              if ($LASTEXITCODE -eq 0 -and (Test-Path $dll)) {
                $checksum = (Get-FileHash $dll -Algorithm SHA256).Hash.ToLowerInvariant()
                if ($checksum -eq $expected -and (Get-Item $dll).Length -eq 115320296) {
                  New-Item -ItemType Directory -Force -Path $dst | Out-Null
                  Copy-Item -LiteralPath $dll -Destination (Join-Path $dst 'libmpv-2.dll') -Force
                  $restored = $true
                  Write-Host 'MPV vérifié depuis les artefacts Kovelyx.'
                }
              }
            }
          }
          # Chemin autonome durable : ZIP d'une Release Kovelyx, sans Nuvio.
          if (-not $restored) {
            Write-Host 'Archive temporaire absente/expirée : restauration depuis les Releases Kovelyx.'
            & ./scripts/restore-windows-mpv.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Restauration autonome MPV en échec.' }
          }
          $file = Join-Path $dst 'libmpv-2.dll'
          if (-not (Test-Path $file)) { throw 'Runtime MPV absent après la restauration.' }
          $actual = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'SHA-256 du runtime MPV invalide.' }
          "### Runtime Windows vérifié depuis Kovelyx, indépendamment des dépôts Nuvio" >> $env:GITHUB_STEP_SUMMARY
      - name: Préparer le SDK officiel Microsoft WebView2
        id: webview
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "1.0.2739.15"
          $dir = Join-Path $env:RUNNER_TEMP "kovelyx-webview2"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $package = Join-Path $dir "sdk.zip"
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/$version" -OutFile $package
          Expand-Archive -Path $package -DestinationPath (Join-Path $dir "sdk") -Force
          $sdk = Join-Path $dir "sdk"
          if (-not (Test-Path (Join-Path $sdk "build/native/include/WebView2.h"))) { throw "WebView2.h introuvable." }
          if (-not (Test-Path (Join-Path $sdk "build/native/x64/WebView2Loader.dll.lib"))) { throw "WebView2Loader.dll.lib introuvable." }
          "WEBVIEW_DIR=$sdk" >> $env:GITHUB_ENV
          Write-Host "SDK WebView2 $version prêt."
      - name: Vérifier les bibliothèques natives indispensables
        id: native
        shell: pwsh
        run: |
          $dll = "apps/desktop/composeApp/src/desktopMain/native/windows/runtime/libmpv-2.dll"
          if (Test-Path $dll) {
            "available=true" >> $env:GITHUB_OUTPUT
            "### Windows : bibliothèque MPV trouvée, compilation autorisée" >> $env:GITHUB_STEP_SUMMARY
          } else {
            "available=false" >> $env:GITHUB_OUTPUT
            Write-Host "::notice title=Windows non compilé::La DLL MPV (115 Mo) manque ; aucun MSI n'est produit. Voir apps/desktop/.kovelyx-binaries-a-sauvegarder.txt"
            "### Windows : compilation non tentée" >> $env:GITHUB_STEP_SUMMARY
            "Le binaire libmpv-2.dll (115 Mo) est absent du dépôt. Aucun MSI n'est disponible." >> $env:GITHUB_STEP_SUMMARY
          }
      - name: Compiler l'installateur MSI via Visual Studio et Gradle
        if: steps.native.outputs.available == 'true'
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "C:/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products "*" -property installationPath
          if (-not $vs) { throw "Visual Studio C++ introuvable sur le runner Windows." }
          $vsdev = Join-Path $vs "Common7/Tools/VsDevCmd.bat"
          if (-not (Test-Path $vsdev)) { throw "VsDevCmd.bat introuvable." }
          $batch = Join-Path $env:RUNNER_TEMP "kovelyx-build-msi.bat"
          @(
            "@echo off",
            "call `"$vsdev`" -arch=x64 -host_arch=x64",
            "if errorlevel 1 exit /b 1",
            "call .\\gradlew.bat :composeApp:packageReleaseMsi :composeApp:packageReleaseExe :composeApp:createReleaseDistributable --no-daemon --max-workers=2 --stacktrace `"-Pnuvio.desktop.versionName=$env:KOVELYX_BUILD_VERSION`" `"-Pnuvio.webview2.dir=$env:WEBVIEW_DIR`" `"-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m`"",
            "exit /b %errorlevel%"
          ) | Set-Content -Path $batch -Encoding ASCII
          & $batch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Valider l'identité réelle du MSI
        if: steps.native.outputs.available == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msis = @(Get-ChildItem 'apps/desktop/composeApp/build/compose/binaries' -Filter '*.msi' -Recurse)
          if ($msis.Count -ne 1) { throw ('Attendu : 1 MSI ; obtenu : ' + $msis.Count) }
          $msi = $msis[0]
          if ($msi.Name -notmatch 'Kovelyx' -or $msi.Length -lt 1000000) { throw 'Nom ou taille du MSI non valides' }
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $database = $installer.OpenDatabase($msi.FullName, 0)
          function Read-Property([string]$name) {
            $view = $database.OpenView("SELECT Value FROM Property WHERE Property = '$name'")
            $null = $view.Execute()
            $record = $view.Fetch()
            $value = if ($null -eq $record) { '' } else { $record.StringData(1).Trim() }
            $null = $view.Close()
            return $value
          }
          # A COM method returning an implicit pipeline value must never contaminate properties.
          $product = [string](Read-Property 'ProductName' | Select-Object -Last 1)
          $vendor = [string](Read-Property 'Manufacturer' | Select-Object -Last 1)
          $upgrade = [string](Read-Property 'UpgradeCode' | Select-Object -Last 1)
          $product = $product.Trim()
          $vendor = $vendor.Trim()
          $upgrade = $upgrade.Trim()
          Write-Host ('ProductName=' + $product + ', Manufacturer=' + $vendor + ', UpgradeCode=' + $upgrade)
          if ($product -ne 'Kovelyx' -or $vendor -ne 'Kovelyx' -or $upgrade -ne '{3F7AF095-1F5E-4D2B-AF6C-3F5C12B2C9A1}') { throw 'Identité MSI différente de Kovelyx' }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $target = Join-Path 'dist' ('Kovelyx-Windows-' + $env:GITHUB_SHA + '.msi')
          Copy-Item -Path $msi.FullName -Destination $target
          $hash = (Get-FileHash -Path $target -Algorithm SHA256).Hash.ToLowerInvariant()
          ($hash + '  ' + (Split-Path $target -Leaf)) | Set-Content -Path ($target + '.sha256') -Encoding Ascii
          ('Kovelyx MSI : produit=' + $product + ', SHA256=' + $hash) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - name: Valider et copier l'installateur EXE complet
        if: steps.native.outputs.available == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exes = @(Get-ChildItem 'apps/desktop/composeApp/build/compose/binaries/main-release' -Filter '*.exe' -Recurse -File |
              Where-Object { $_.FullName -match '[\\/]exe[\\/]' })
          if ($exes.Count -ne 1) { throw ('Attendu : un seul installateur EXE ; obtenu : ' + $exes.Count) }
          $source = $exes[0]
          if ($source.Name -notmatch '^Kovelyx' -or $source.Length -lt 1000000) {
              throw 'Fichier EXE invalide ou incomplet'
          }
          $magic = [System.IO.File]::ReadAllBytes($source.FullName)
          if ($magic[0] -ne 77 -or $magic[1] -ne 90) { throw 'Signature PE (MZ) absente dans EXE' }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $target = Join-Path 'dist' ('Kovelyx-Windows-Setup-' + $env:GITHUB_SHA + '.exe')
          Copy-Item -Path $source.FullName -Destination $target -Force
          $hash = (Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()
          ($hash + '  ' + (Split-Path $target -Leaf)) | Set-Content ($target + '.sha256') -Encoding Ascii
          ('EXE autonome pour installation : ' + $target + ' SHA256=' + $hash) | Out-File $env:GITHUB_STEP_SUMMARY -Append
      - name: Préparer l'archive Windows portable complète
        if: steps.native.outputs.available == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Use the app-image generated by createReleaseDistributable, not a
          # standalone EXE copied out of an MSI: it needs app/ and runtime/.
          $root = 'apps/desktop/composeApp/build/compose/binaries/main-release/app'
          if (-not (Test-Path $root)) { throw 'Distribution portable Compose absente.' }
          $exes = @(Get-ChildItem $root -Recurse -File -Filter 'Kovelyx.exe')
          if ($exes.Count -ne 1) { throw ('Un seul lanceur Kovelyx.exe attendu, obtenu : ' + $exes.Count) }
          $appRoot = $exes[0].Directory.FullName
          # Marker exists ONLY in the portable ZIP, never in installed EXE/MSI.
          'Kovelyx portable package' | Set-Content -Path (Join-Path $appRoot 'Kovelyx.portable') -Encoding Ascii
          foreach ($folder in @('app', 'runtime')) {
            if (-not (Test-Path (Join-Path $appRoot $folder))) {
              throw ('Image portable incomplète, dossier absent : ' + $folder)
            }
          }
          $target = Join-Path 'dist' ('Kovelyx-Windows-Portable-' + $env:GITHUB_SHA + '.zip')
          # Keep the top-level Kovelyx folder and its entire Java runtime.
          Compress-Archive -Path $appRoot -DestinationPath $target -CompressionLevel Optimal -Force
          if ((Get-Item $target).Length -lt 1000000) { throw 'Archive portable trop petite' }
          $extract = Join-Path $env:RUNNER_TEMP 'kovelyx-portable-check'
          Expand-Archive $target $extract -Force
          $name = Split-Path $appRoot -Leaf
          foreach ($required in @("$name/Kovelyx.exe", "$name/app", "$name/runtime", "$name/Kovelyx.portable")) {
            if (-not (Test-Path (Join-Path $extract $required))) {
              throw ('Fichier ZIP incomplet : ' + $required)
            }
          }
          $hash = (Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()
          ($hash + '  ' + (Split-Path $target -Leaf)) | Set-Content -Path ($target + '.sha256') -Encoding Ascii
          ('ZIP portable complet : ' + $target + ', SHA256=' + $hash) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - name: Exécuter les tests unitaires des fonctions Desktop
        if: steps.native.outputs.available == 'true'
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\gradlew.bat :composeApp:desktopTest --no-daemon --max-workers=2 "-Pnuvio.desktop.versionName=$env:KOVELYX_BUILD_VERSION" "-Pnuvio.webview2.dir=$env:WEBVIEW_DIR"
          if ($LASTEXITCODE -ne 0) {
            '### Tests Desktop en échec — distribution bloquée' >> $env:GITHUB_STEP_SUMMARY
            exit $LASTEXITCODE
          }
          '### Tests Desktop réussis (moteur, thèmes, lecteur, extensions, stockage : tests automatisés uniquement)' >> $env:GITHUB_STEP_SUMMARY

      - name: Enregistrer les rapports des tests Windows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kovelyx-Windows-test-reports
          path: apps/desktop/composeApp/build/reports/tests/desktopTest/
          if-no-files-found: ignore
          retention-days: 14
      - name: Enregistrer le MSI
        if: steps.native.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Kovelyx-Windows-installers-experimental
          path: dist/
          if-no-files-found: error
          retention-days: 30
