name: Nettoyer les anciennes branches déjà intégrées
on:
  push:
    branches: [cleanup/legacy-owned-names-20261110]
    paths:
      - scripts/maintenance/cleanup_merged_branches.py
      - scripts/maintenance/merged-branches-20261110.json
      - .github/workflows/cleanup-merged-branches-20261110.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: kovelyx-merged-branch-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.repository == 'anderson76389/Kovelyx' && github.ref == 'refs/heads/cleanup/legacy-owned-names-20261110'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Supprimer uniquement les branches intégrées et inactives
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/maintenance/cleanup_merged_branches.py --apply
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: branches-supprimees-et-conservees
          path: merged-branches-cleanup-result.json
          retention-days: 60
