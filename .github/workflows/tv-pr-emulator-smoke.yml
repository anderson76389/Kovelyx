name: Vérifier la TV sur émulateur avant fusion

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tv-pr-emulator-smoke.yml'
      - 'apps/tv/**'
      - 'scripts/configure-cloud-build.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kovelyx-tv-pr-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tv-emulator:
    name: Android TV - installer et lancer la vraie APK sur Google TV
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configurer l'URL de comptes de test sans identifiants
        env:
          KOVELYX_CLOUDFLARE_URL: ${{ vars.KOVELYX_CLOUDFLARE_URL || 'https://kovelyx-cloud.mailpromahe.workers.dev' }}
        run: python3 scripts/configure-cloud-build.py --platform tv
      - name: Compiler le binaire Android TV réellement testé
        working-directory: apps/tv
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleFullDebug --no-daemon --max-workers=1 \
            -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=768m" \
            -Pkotlin.compiler.execution.strategy=in-process
      - name: Contrôler l'APK universelle
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' apks < <(find apps/tv/app/build/outputs/apk/full/debug \
            -maxdepth 1 -type f -name '*universal*.apk' -print0)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::APK TV universelle unique introuvable"
            exit 1
          fi
          unzip -tq "${apks[0]}" >/dev/null
          mkdir -p /tmp/kovelyx-tv-pr
          cp "${apks[0]}" /tmp/kovelyx-tv-pr/kovelyx-tv-test.apk
          sha256sum /tmp/kovelyx-tv-pr/kovelyx-tv-test.apk > /tmp/kovelyx-tv-pr/sha256.txt
      - name: Autoriser KVM si disponible
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Démarrage réel sur Google TV 34 avec télécommande D-pad
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google-tv
          arch: x86
          profile: tv_1080p
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disk-size: 6144M
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r /tmp/kovelyx-tv-pr/kovelyx-tv-test.apk
            adb shell monkey -p com.kovelyx.tv.debug -c android.intent.category.LEANBACK_LAUNCHER 1
            sleep 25
            adb shell pidof com.kovelyx.tv.debug
            adb shell input keyevent KEYCODE_DPAD_RIGHT
            adb shell input keyevent KEYCODE_DPAD_DOWN
            adb shell input keyevent KEYCODE_DPAD_CENTER
            sleep 3
            adb shell pidof com.kovelyx.tv.debug
            adb shell screencap -p /sdcard/kovelyx-tv-pr.png
            adb pull /sdcard/kovelyx-tv-pr.png /tmp/kovelyx-tv-pr/screenshot.png
            adb logcat -d -v brief -s AndroidRuntime:E > /tmp/kovelyx-tv-pr/androidruntime.txt
            if grep -F "FATAL EXCEPTION" /tmp/kovelyx-tv-pr/androidruntime.txt; then
              echo "::error::Crash AndroidRuntime détecté sur l'émulateur"
              exit 1
            fi
      - name: Archiver preuves TV, capture et signature SHA-256
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kovelyx-tv-pr-emulator-proof
          path: |
            /tmp/kovelyx-tv-pr/screenshot.png
            /tmp/kovelyx-tv-pr/androidruntime.txt
            /tmp/kovelyx-tv-pr/sha256.txt
          if-no-files-found: warn
          retention-days: 30
