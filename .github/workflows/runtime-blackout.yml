name: Tester les APK Kovelyx avec les DNS Nuvio interdits

# Smoke tests d'execution reelle : catalogue et video avec API privee ne sont
# pas certifies par ce test. Voir docs/PREUVE_INDEPENDANCE.md.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runtime-blackout.yml'
      - 'services/kovelyx-cloudflare/tests/portable-d1-migration-e2e.mjs'
      - 'scripts/tests/runtime-blackout-android.sh'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runtime-blackout.yml'
      - '.github/workflows/full-repository-independence-audit.yml'
      - 'scripts/tests/runtime-blackout-android.sh'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  emulator-blackout:
    name: DNS Nuvio bloque sur emulateur - ${{ matrix.platform }}
    if: ${{ github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v1.') }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mobile
            release_prefix: v1.
            apk_glob: 'Kovelyx-Android-*.apk'
            api_target: google_apis
            api_arch: x86_64
            device_profile: pixel_6
            emulator_dns: '-no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -dns-server 127.0.0.1'
          - platform: tv
            release_prefix: v1.
            apk_glob: 'Kovelyx-TV-*-universal.apk'
            api_target: google-tv
            api_arch: x86
            device_profile: tv_1080p
            emulator_dns: '-no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -dns-server 127.0.0.1'
    steps:
      - uses: actions/checkout@v4
      - name: Telecharger la derniere APK de la plateforme dans les Releases Kovelyx
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PREFIX: ${{ matrix.release_prefix }}
          APK_GLOB: ${{ matrix.apk_glob }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > /tmp/kovelyx-releases.json
          # Always select a COMPLETE unified Kovelyx Release with both Android APKs
          # and the Windows portable bundle. On a release event, test that exact tag.
          requested=""
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then requested="$GITHUB_REF_NAME"; fi
          tag="$(jq -r --arg prefix "$RELEASE_PREFIX" --arg requested "$requested" '
            [.[] | select(.draft == false
              and (.tag_name | test("^v[0-9]+[.][0-9]+[.][0-9]+$"))
              and (.tag_name | startswith($prefix))
              and ($requested == "" or .tag_name == $requested)
              and ([.assets[]?.name | select(startswith("Kovelyx-Android-") and endswith(".apk"))] | length > 0)
              and ([.assets[]?.name | select(startswith("Kovelyx-TV-") and endswith("-universal.apk"))] | length > 0)
              and ([.assets[]?.name | select(startswith("Kovelyx-Windows-Portable-") and endswith(".zip"))] | length > 0)
            )] | sort_by(.published_at) | last | .tag_name // empty' /tmp/kovelyx-releases.json)"
          test -n "$tag" || { echo "::error::Aucune Release APK Kovelyx pour $RELEASE_PREFIX"; exit 1; }
          echo "KOVELYX_RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          mkdir -p /tmp/kovelyx-runtime-apk
          # Le test doit installer des octets dont le SHA-256 correspond à
          # l'empreinte publiée, pas simplement un fichier portant le bon nom.
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern "$APK_GLOB" --pattern "$APK_GLOB.sha256" --dir /tmp/kovelyx-runtime-apk
          count="$(find /tmp/kovelyx-runtime-apk -type f -name '*.apk' | wc -l)"
          [[ "$count" == 1 ]] || { echo "::error::Un seul APK attendu : $count"; exit 1; }
          apk="$(find /tmp/kovelyx-runtime-apk -type f -name '*.apk' -print -quit)"
          test -s "$apk.sha256" || { echo "::error::Empreinte publique APK absente"; exit 1; }
          (cd /tmp/kovelyx-runtime-apk && sha256sum --check -- "$(basename "$apk").sha256")
          unzip -tq "$apk" >/dev/null
          echo "Version testee et SHA-256 valide : $tag" >> "$GITHUB_STEP_SUMMARY"
      - name: Installer un DNS local qui bloque les anciens domaines Nuvio
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends dnsmasq-base dnsutils
          cat > /tmp/kovelyx-dnsmasq.conf <<'DNS'
          no-hosts
          listen-address=127.0.0.1
          bind-interfaces
          cache-size=0
          address=/nuvio.tv/0.0.0.0
          address=/nuvio.tv/::
          address=/nuvioapp.space/0.0.0.0
          address=/nuvioapp.space/::
          log-queries
          log-facility=/tmp/kovelyx-dns.log
          DNS
          sudo touch /tmp/kovelyx-dns.log
          sudo dnsmasq --conf-file=/tmp/kovelyx-dnsmasq.conf --pid-file=/tmp/kovelyx-dnsmasq.pid
          sudo chmod 644 /tmp/kovelyx-dns.log
          dig @127.0.0.1 +short api.nuvio.tv A | grep -Fx '0.0.0.0'
          dig @127.0.0.1 +short api-two.nuvioapp.space A | grep -Fx '0.0.0.0'
          dig @127.0.0.1 +short api.github.com A | grep -E '^[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+$'
          initial_nuvio_queries="$(grep -ci 'api.nuvio.tv' /tmp/kovelyx-dns.log || true)"
          echo "KOVELYX_DNS_BASELINE=$initial_nuvio_queries" >> "$GITHUB_ENV"
          echo "Resolution locale du DNS de filtrage validee."
      - name: Autoriser l'acceleration materielle KVM
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Tester sur Android avec filtrage DNS Nuvio, autres services autorises
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: ${{ matrix.api_target }}
          arch: ${{ matrix.api_arch }}
          profile: ${{ matrix.device_profile }}
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disk-size: 6144M
          disable-animations: true
          emulator-options: ${{ matrix.emulator_dns }}
          script: bash scripts/tests/runtime-blackout-android.sh ${{ matrix.platform }}
      - name: Archiver DNS, screenshots, checksums et journaux de l'application
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kovelyx-nuvio-blocked-emulator-${{ matrix.platform }}
          path: |
            /tmp/kovelyx-blackout-proof/
            /tmp/kovelyx-dns.log
          if-no-files-found: ignore
          retention-days: 21
          overwrite: true
      - name: Rediger les limites du test
        if: success()
        run: |
          {
            echo "### ${{ matrix.platform }} : test Nuvio DNS bloque reussi"
            echo '- Un APK provenant des Releases Kovelyx a demarre et accepte une navigation de base.'
            echo '- Le domaine historique renvoie une adresse de blocage dans l emulation, les services tiers restent resolubles.'
            echo '- Cette preuve ne valide pas des catalogues/debridage exigeant une cle ou un compte, ni tous les codecs.'
          } >> "$GITHUB_STEP_SUMMARY"
