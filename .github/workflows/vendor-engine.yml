name: Vérifier les sources du moteur conservé par Kovelyx

# Les sources sont déjà copiées dans vendor/engine. Ne tente jamais de les
# re-télécharger depuis NuvioMedia, même en cas de suppression du dossier.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vendor-engine.yml'
      - 'vendor/engine/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-engine:
    name: Archives natives locales et licences
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier l'archive sans recontacter NuvioMedia
        shell: bash
        run: |
          set -euo pipefail
          for file in vendor/engine/LICENSE vendor/engine/THIRD_PARTY_NOTICES.md vendor/engine/CMakeLists.txt vendor/engine/KOVELYX_PROVENANCE.md vendor/engine/src/core/engine.cpp; do
            test -s "$file" || { echo "::error::Archive du moteur incomplète : $file"; exit 1; }
          done
          test -d vendor/engine/include
          echo "Sources du moteur et notices archivées dans le dépôt Kovelyx." >> "$GITHUB_STEP_SUMMARY"
          echo "La compilation du cœur natif et le moteur P2P intégral sont des preuves distinctes." >> "$GITHUB_STEP_SUMMARY"
