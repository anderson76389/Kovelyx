name: Vérifier les vraies mises à jour Windows Android et TV
on:
  pull_request:
    branches: [main]
    paths:
      - 'shared/**'
      - 'scripts/tests/test_updater_release_contract.py'
      - 'scripts/tests/test_updater_resource_contract.py'
      - 'scripts/publish-verified-preview.py'
      - 'scripts/tests/test_verified_preview.py'
      - 'scripts/tests/prepare_ota_test_apks.sh'
      - 'scripts/tests/ota_in_place_upgrade.sh'
      - 'apps/tv/app/src/main/java/com/kovelyx/tv/core/image/**'
      - 'apps/tv/app/src/test/java/com/kovelyx/tv/core/image/**'
      - '.github/workflows/check-all-updaters.yml'
      - '.github/workflows/publish-signed-android.yml'
      - 'apps/desktop/composeApp/src/**/updater/**'
      - 'apps/mobile/composeApp/src/**/updater/**'
      - 'apps/tv/app/src/**/updater/**'
  push:
    branches: [main]
    paths:
      - 'shared/**'
      - 'scripts/tests/test_updater_release_contract.py'
      - 'scripts/tests/test_updater_resource_contract.py'
      - 'scripts/publish-verified-preview.py'
      - 'scripts/tests/test_verified_preview.py'
      - 'scripts/tests/prepare_ota_test_apks.sh'
      - 'scripts/tests/ota_in_place_upgrade.sh'
      - 'apps/tv/app/src/main/java/com/kovelyx/tv/core/image/**'
      - 'apps/tv/app/src/test/java/com/kovelyx/tv/core/image/**'
      - '.github/workflows/check-all-updaters.yml'
      - '.github/workflows/publish-signed-android.yml'
      - 'apps/desktop/composeApp/src/**/updater/**'
      - 'apps/mobile/composeApp/src/**/updater/**'
      - 'apps/tv/app/src/**/updater/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-contract:
    name: Releases officielles et SHA-256 de chaque plateforme
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier la syntaxe du vérificateur
        run: python -m py_compile scripts/tests/test_updater_release_contract.py
      - name: Vérifier les mises à jour et les budgets ressources sans modifier les données
        run: |
          python3 -m py_compile scripts/tests/test_updater_resource_contract.py
          python3 scripts/tests/test_updater_resource_contract.py
          python3 -m unittest discover -s scripts/tests -p test_verified_preview.py
          bash -n scripts/tests/prepare_ota_test_apks.sh scripts/tests/ota_in_place_upgrade.sh
      - name: Tester les fichiers publiés réellement sur GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/tests/test_updater_release_contract.py
