name: Vérifier les archives autonomes des trois applications Kovelyx

# Vérification locale seulement : ne contacte jamais les dépôts NuvioMedia.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-sources.yml'
      - 'docs/PROVENANCE.md'
      - 'apps/tv/.kovelyx-source.txt'
      - 'apps/mobile/.kovelyx-source.txt'
      - 'apps/desktop/.kovelyx-source.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-snapshots:
    name: Sources Windows, Android et Android TV préservées localement
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier les sources et licences dans Kovelyx, sans réseau Nuvio
        shell: bash
        run: |
          set -euo pipefail
          for app in tv mobile desktop; do
            test -s "apps/$app/LICENSE" || { echo "::error::Licence manquante : $app"; exit 1; }
            test -s "apps/$app/.kovelyx-source.txt" || { echo "::error::Provenance manquante : $app"; exit 1; }
            count="$(find "apps/$app" -type f -name '*.kt' | wc -l)"
            (( count > 50 )) || { echo "::error::Sources Kotlin incomplètes : $app"; exit 1; }
            echo "### apps/$app — $count fichiers Kotlin sauvegardés" >> "$GITHUB_STEP_SUMMARY"
          done
          test -s apps/mobile/MPVKit/LICENSE
          test -s apps/desktop/MPVKit/LICENSE
          echo "Archives autonomes présentes, aucun téléchargement depuis l'amont." >> "$GITHUB_STEP_SUMMARY"
