name: Publier les APK Kovelyx en préversion

on:
  workflow_run:
    workflows:
      - "Compiler Kovelyx (APK et diagnostic Windows)"
    types: [completed]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Identifiant du workflow de compilation contenant les deux APK"
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: kovelyx-android-prerelease
  cancel-in-progress: false

jobs:
  publish:
    name: Vérifier les APK et créer une préversion
    if: ${{ github.event_name == 'workflow_dispatch' || ((github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure') && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Vérifier les deux jobs Android
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.build_run_id || github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::ID invalide"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > /tmp/kv-run.json
          jq -e --arg repo "$GITHUB_REPOSITORY" '.head_repository.full_name == $repo and .head_branch == "main" and .status == "completed" and .name == "Compiler Kovelyx (APK et diagnostic Windows)"' /tmp/kv-run.json >/dev/null || { echo "::error::Compilation non approuvée"; exit 1; }
          sha="$(jq -r '.head_sha' /tmp/kv-run.json)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" > /tmp/kv-jobs.json
          for name in "Android mobile - APK Full Debug" "Android TV - APK Full Debug"; do
            jq -e --arg name "$name" '[.jobs[] | select(.name == $name and .conclusion == "success")] | length == 1' /tmp/kv-jobs.json >/dev/null || { echo "::error::Compilation non réussie : $name"; exit 1; }
          done
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" > /tmp/kv-artifacts.json
          for artifact in kovelyx-mobile-debug kovelyx-tv-debug; do
            jq -e --arg name "$artifact" '[.artifacts[] | select(.name == $name and .expired == false)] | length == 1' /tmp/kv-artifacts.json >/dev/null || { echo "::error::Artefact absent : $artifact"; exit 1; }
          done
          {
            echo "SOURCE_SHA=$sha"
            echo "RUN_ID=$RUN_ID"
            echo "TAG=preview-${sha:0:12}"
          } >> "$GITHUB_ENV"

      - name: Télécharger et contrôler les APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist /tmp/kv-mobile /tmp/kv-tv
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name kovelyx-mobile-debug --dir /tmp/kv-mobile
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name kovelyx-tv-debug --dir /tmp/kv-tv
          mapfile -d '' -t mobile_files < <(find /tmp/kv-mobile -type f -iname '*.apk' -print0)
          mapfile -d '' -t tv_files < <(find /tmp/kv-tv -type f -iname '*universal*.apk' -print0)
          [[ "${#mobile_files[@]}" == 1 ]] || { echo "::error::Il faut exactement un APK mobile"; exit 1; }
          [[ "${#tv_files[@]}" == 1 ]] || { echo "::error::Il faut exactement un APK TV universel"; exit 1; }
          cp -- "${mobile_files[0]}" "dist/Kovelyx-Mobile-$TAG.apk"
          cp -- "${tv_files[0]}" "dist/Kovelyx-TV-$TAG.apk"
          for apk in dist/*.apk; do
            [[ "$(stat -c%s "$apk")" -gt 100000 ]] || { echo "::error::APK trop petit"; exit 1; }
            unzip -tq "$apk" > /dev/null || { echo "::error::Fichier corrompu : $apk"; exit 1; }
            (cd dist && sha256sum "$(basename "$apk")" > "$(basename "$apk").sha256")
            echo "APK vérifié : $apk"
          done

      - name: Publier la Release expérimentale
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.KOVELYX_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "La préversion existe déjà. Aucun écrasement."
            exit 0
          fi
          notes="PRÉVERSION EXPÉRIMENTALE. Sources : $SOURCE_SHA. APK Android et Android TV compilés et archives intègres, non testés sur appareils réels. Les mises à jour automatiques et la signature stable ne sont pas encore garanties. Certaines fonctions et dépendances Nuvio peuvent toujours être présentes. Sauvegardez vos données. Licences et sources dans ce dépôt."
          gh release create "$TAG" dist/*.apk dist/*.sha256 --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title "Kovelyx $TAG · Android et TV (expérimental)" --prerelease --notes "$notes"
