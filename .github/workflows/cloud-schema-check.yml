name: Vérifier la base de comptes Kovelyx

on:
  push:
    branches: [main]
    paths:
      - 'services/kovelyx-cloudflare/**'
      - '.github/workflows/cloud-schema-check.yml'
  pull_request:
    paths:
      - 'services/kovelyx-cloudflare/**'
      - '.github/workflows/cloud-schema-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Schéma Cloudflare D1, isolation et intégrité
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Tester toutes les migrations D1 et les profils
        run: python3 services/kovelyx-cloudflare/tests/check-d1-schema.py
      - name: Documenter le niveau de vérification
        run: |
          echo 'Schéma SQLite D1 : migrations, propriété des profils, cascade et conflits de révision vérifiés.' >> "$GITHUB_STEP_SUMMARY"
          echo 'La validation réseau des comptes Better Auth est effectuée dans le workflow Cloudflare dédié.' >> "$GITHUB_STEP_SUMMARY"
