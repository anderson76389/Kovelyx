name: Vérifier les sauvegardes et le stockage local

on:
  pull_request:
    paths:
      - 'shared/**'
      - '.github/workflows/maintenance-safety.yml'
  push:
    branches: [main]
    paths:
      - 'shared/**'
      - '.github/workflows/maintenance-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety:
    name: Sauvegardes chiffrées et restauration (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Préparer un compilateur Kotlin vérifié
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/kotlin.zip" https://github.com/JetBrains/kotlin/releases/download/v2.2.21/kotlin-compiler-2.2.21.zip
          echo "a623871f1cd9c938946948b70ef9170879f0758043885bbd30c32f024e511714  $RUNNER_TEMP/kotlin.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/kotlin.zip" -d "$RUNNER_TEMP/kotlin"
      - name: Tester le moteur exact livré aux trois applications
        shell: bash
        run: |
          set -euo pipefail
          compiler="$RUNNER_TEMP/kotlin/kotlinc/bin/kotlinc"
          "$compiler" shared/maintenance/kotlin/com/kovelyx/maintenance/LocalMaintenance.kt shared/maintenance/tests/LocalMaintenanceTest.kt -include-runtime -d "$RUNNER_TEMP/maintenance-tests.jar"
          java -Xmx192m -jar "$RUNNER_TEMP/maintenance-tests.jar"
      - name: Tester les diagnostics de synchronisation
        shell: bash
        run: |
          set -euo pipefail
          compiler="$RUNNER_TEMP/kotlin/kotlinc/bin/kotlinc"
          # Git Bash java expects semicolons between classpath entries on Windows.
          separator=':'
          if [[ "$RUNNER_OS" == Windows ]]; then separator=';'; fi
          coroutines="$RUNNER_TEMP/kotlin/kotlinc/lib/kotlinx-coroutines-core-jvm.jar"
          "$compiler" -opt-in=kotlin.time.ExperimentalTime -cp "$coroutines" shared/maintenance-ui/kotlin/com/kovelyx/maintenance/ui/SyncHealth.kt shared/maintenance/tests/SyncHealthTest.kt -include-runtime -d "$RUNNER_TEMP/sync-health-tests.jar"
          java -cp "$RUNNER_TEMP/sync-health-tests.jar${separator}${coroutines}" com.kovelyx.maintenance.ui.SyncHealthTestKt
