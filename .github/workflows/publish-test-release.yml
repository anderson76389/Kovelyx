name: Publier une préversion Kovelyx (APK ou MSI)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version de test, par exemple v0.1.0-beta.1'
        required: true
        type: string
      build_run_id:
        description: 'ID numérique du workflow de compilation ayant produit le fichier'
        required: true
        type: string
      platform:
        description: 'Quel appareil ?'
        type: choice
        required: true
        options:
          - tv
          - mobile
          - windows
      validation_confirmed:
        description: "J'ai vérifié l'APK/MSI et son droit de redistribution. Publier comme PRÉVERSION."
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: ${{ inputs.validation_confirmed }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Sources et contexte
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vérifier la version et la compilation choisie
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RUN_ID: ${{ inputs.build_run_id }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[0-9]+$ ]] || { echo "::error::Utiliser une version de test v0.1.0-beta.1"; exit 1; }
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::ID de build invalide"; exit 1; }
          case "$PLATFORM" in
            tv) job="Android TV - APK Full Debug"; artifact="kovelyx-tv-debug"; prefix="Kovelyx-TV"; suffix=".apk" ;;
            mobile) job="Android mobile - APK Full Debug"; artifact="kovelyx-mobile-debug"; prefix="Kovelyx-Mobile"; suffix=".apk" ;;
            windows) job="Compiler Kovelyx Windows"; artifact="Kovelyx-Windows-MSI-experimental"; prefix="Kovelyx-Windows"; suffix=".msi" ;;
            *) exit 1 ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > /tmp/kovelyx_run.json
          jq -e --arg owner "$GITHUB_REPOSITORY" '.head_repository.full_name == $owner and .head_branch == "main" and .status == "completed"' /tmp/kovelyx_run.json >/dev/null || {
            echo "::error::Ce run n'est pas un build terminé de la branche main de Kovelyx"; exit 1;
          }
          source_sha="$(jq -r '.head_sha' /tmp/kovelyx_run.json)"
          git merge-base --is-ancestor "$source_sha" HEAD || { echo "::error::Build ne provenant pas de l'historique actuel"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" > /tmp/kovelyx_jobs.json
          jq -e --arg job "$job" '[.jobs[] | select(.name==$job and .conclusion=="success")] | length > 0' /tmp/kovelyx_jobs.json >/dev/null || {
            echo "::error::La compilation de cette plateforme n'a pas réussi"; exit 1;
          }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" > /tmp/kovelyx_artifacts.json
          jq -e --arg artifact "$artifact" '[.artifacts[] | select(.name==$artifact and .expired==false)] | length > 0' /tmp/kovelyx_artifacts.json >/dev/null || {
            echo "::error::Aucun fichier généré pour cette plateforme ou artefact expiré"; exit 1;
          }
          {
            echo "KOVELYX_VERSION=$RELEASE_VERSION"
            echo "KOVELYX_RUN_ID=$RUN_ID"
            echo "KOVELYX_SOURCE_SHA=$source_sha"
            echo "KOVELYX_ARTIFACT=$artifact"
            echo "KOVELYX_PREFIX=$prefix"
            echo "KOVELYX_SUFFIX=$suffix"
          } >> "$GITHUB_ENV"

      - name: Télécharger uniquement le paquet issu du build réussi
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ inputs.platform }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$KOVELYX_RUN_ID" --name "$KOVELYX_ARTIFACT" --dir dist
          mapfile -d '' -t files < <(find dist -type f -name "*$KOVELYX_SUFFIX" -print0)
          [[ "${#files[@]}" == "1" ]] || { echo "::error::Un seul fichier de paquet attendu ; fichiers trouvés : ${#files[@]}"; exit 1; }
          size="$(stat -c %s "${files[0]}")"
          ((size > 100000)) || { echo "::error::Paquet anormalement petit"; exit 1; }
          name="$KOVELYX_PREFIX-$KOVELYX_VERSION$KOVELYX_SUFFIX"
          cp -- "${files[0]}" "dist/$name"
          (cd dist && sha256sum "$name" > "$name.sha256")
          rm -f -- "${files[0]}"
          echo "KOVELYX_PACKAGE=dist/$name" >> "$GITHUB_ENV"
          if [[ "$PLATFORM" == "windows" ]]; then
            mapfile -d '' -t zips < <(find dist -type f -name '*Portable*.zip' -print0)
            [[ "${#zips[@]}" == "1" ]] || { echo "::error::Archive Windows portable manquante ou ambiguë"; exit 1; }
            portable="Kovelyx-Windows-Portable-$KOVELYX_VERSION.zip"
            cp -- "${zips[0]}" "dist/$portable"
            (cd dist && sha256sum "$portable" > "$portable.sha256")
            echo "KOVELYX_PORTABLE=dist/$portable" >> "$GITHUB_ENV"
          fi

      - name: Publier la préversion (jamais comme version stable)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version }}
          KOVELYX_PLATFORM: ${{ inputs.platform }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release view "$TAG" --json isPrerelease --jq '.isPrerelease' | grep -qx true || {
              echo "::error::Une version stable existe déjà sous ce tag"; exit 1;
            }
            if [[ "$KOVELYX_PLATFORM" == "windows" ]]; then
              gh release upload "$TAG" "$KOVELYX_PACKAGE" "$KOVELYX_PACKAGE.sha256" "$KOVELYX_PORTABLE" "$KOVELYX_PORTABLE.sha256" --clobber
            else
              gh release upload "$TAG" "$KOVELYX_PACKAGE" "$KOVELYX_PACKAGE.sha256"
            fi
          else
            assets=("$KOVELYX_PACKAGE" "$KOVELYX_PACKAGE.sha256")
            if [[ "$KOVELYX_PLATFORM" == "windows" ]]; then
              assets+=("$KOVELYX_PORTABLE" "$KOVELYX_PORTABLE.sha256")
            fi
            gh release create "$TAG" "${assets[@]}" \
              --target "$KOVELYX_SOURCE_SHA" \
              --title "Kovelyx $TAG - préversion de test" \
              --prerelease \
              --notes "Préversion expérimentale : tests de compatibilité et de lecture non certifiés. Sources et obligations de licence dans le dépôt. Il ne s'agit pas d'une version stable. Signature Android de développement : une future installation peut nécessiter la désinstallation avant mise à jour."
          fi
