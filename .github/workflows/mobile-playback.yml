name: Lire une vidéo dans les deux lecteurs Android mobile
on:
  push:
    branches: [main, fix/cloudflare-network-status-and-settings]
    paths:
      - 'shared/**'
      - 'apps/mobile/**'
      - '.github/workflows/mobile-playback.yml'
  pull_request:
    branches: [main]
    paths: ['shared/**', '.github/workflows/mobile-playback.yml', 'apps/mobile/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kovelyx-mobile-real-playback-${{ github.ref }}
  cancel-in-progress: true
jobs:
  playback:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Réserver de la place pour Android et le code optimisé
        shell: bash
        run: |
          set -euo pipefail
          # Ephemeral GitHub runner only: these toolchains are unused by this Android job.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h .
      - uses: gradle/actions/setup-gradle@v4
      - name: Préparer KVM et les bibliothèques de l'émulateur
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpulse0 libnss3 libx11-6 libxkbcommon0 libxcb1 libxcomposite1 libxcursor1 libxi6 libxtst6 libxrandr2 libxdamage1 libxfixes3
      - name: Bloquer les anciens domaines Nuvio dans le DNS de l'émulateur
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends dnsmasq-base dnsutils
          cat > /tmp/kovelyx-playback-dnsmasq.conf <<'DNS'
          no-hosts
          listen-address=127.0.0.1
          bind-interfaces
          cache-size=0
          address=/nuvio.tv/0.0.0.0
          address=/nuvioapp.space/0.0.0.0
          log-queries
          log-facility=/tmp/kv-playback-nuvio-dns.log
          DNS
          sudo touch /tmp/kv-playback-nuvio-dns.log
          sudo dnsmasq --conf-file=/tmp/kovelyx-playback-dnsmasq.conf --pid-file=/tmp/kv-playback-dnsmasq.pid
          sudo chmod 644 /tmp/kv-playback-nuvio-dns.log
          dig @127.0.0.1 +short api.nuvio.tv A | grep -Fx '0.0.0.0'
      - name: Vérifier la lecture H264 dans les surfaces ExoPlayer et libmpv
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disk-size: 4096M
          disable-animations: true
          emulator-options: '-no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -dns-server 127.0.0.1'
          script: bash scripts/tests/mobile-playback-nuvio-blackout.sh
      - name: Rapports de lecture et diagnostics Android
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-mobile-real-playback
          path: |
            apps/mobile/androidApp/build/outputs/androidTest-results/connected/**
            apps/mobile/androidApp/build/reports/androidTests/connected/**
          retention-days: 14
