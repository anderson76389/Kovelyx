name: Migrer Kovelyx Android TV

on:
  push:
    branches:
      - migration/kovelyx-tv-package-20261027
    paths:
      - scripts/migrate-kovelyx-tv-packages.py
      - .github/workflows/migrate-kovelyx-tv.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: migration-kovelyx-tv-packages
  cancel-in-progress: true

jobs:
  migrate-and-build:
    name: Migration TV, contrôles et compilation APK
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Migrer les sources Kotlin, Java, JNI, XML et Gradle
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/migrate-kovelyx-tv-packages.py
          python3 scripts/migrate-kovelyx-tv-packages.py --check
          python3 scripts/tests/audit-tv-nuvio-urls.py
          python3 scripts/tests/verify-upstream-independence.py
      - name: Enregistrer la migration effective sur la branche de la PR
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A apps/tv scripts .github/workflows
          if git diff --cached --quiet; then
            echo "Migration déjà enregistrée."
          else
            git commit -m "refactor(tv): migrer com.nuvio.tv vers com.kovelyx.tv avec pont JNI"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
          echo "La migration est enregistrée sur une branche séparée : validation APK et tests nécessaire avant fusion." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compiler l'APK Android TV universel
        working-directory: apps/tv
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleFullDebug --no-daemon --max-workers=1 \
            -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=768m" \
            -Pkotlin.compiler.execution.strategy=in-process
      - name: Publier l'APK TV de test
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kovelyx-TV-migration-debug
          path: apps/tv/app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Rappeler les limites de validation
        if: always()
        run: |
          echo "Le build valide la compilation uniquement ; lecture HDR/Dolby Vision, profils et Cloudflare requièrent encore des tests sur TV." >> "$GITHUB_STEP_SUMMARY"
